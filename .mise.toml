[env]
KUBECONFIG = "{{config_root}}/kubernetes/clusters/korg/kubeconfig:{{config_root}}/kubernetes/clusters/kdev/kubeconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
_.python.venv = { path = "{{config_root}}/.venv", create = true }

[tools]
"aqua:FiloSottile/age" = "1.3.1"
"aqua:budimanjojo/talhelper" = "3.1.9"
"aqua:cilium/cilium-cli" = "0.19.2"
"aqua:cli/cli" = "2.92.0"
"aqua:cloudflare/cloudflared" = "2026.3.0"
"aqua:cue-lang/cue" = "0.16.1"
"aqua:a8m/envsubst" = "1.4.3"
"aqua:fluxcd/flux2" = "2.8.6"
"aqua:getsops/sops" = "3.12.2"
"aqua:go-task/task" = "3.50.0"
"aqua:helm/helm" = "3.20.2"
"aqua:helmfile/helmfile" = "1.4.5"
"aqua:jqlang/jq" = "1.7.1"
"aqua:kubernetes-sigs/kustomize" = "5.6.0"
"aqua:kubernetes/kubectl" = "1.33.1"
"aqua:mikefarah/yq" = "4.53.2"
"aqua:siderolabs/talos" = "1.12.7"
"aqua:yannh/kubeconform" = "0.7.0"
"pipx" = "1.11.1"
"pipx:makejinja" = "2.8.2"
"pipx:pre-commit" = "4.6.0"
"pipx:flux-local" = "latest"
"python" = "3.14.4"
"github:mitsuhiko/minijinja" = "2.19.0"
"aqua:shellcheck" = "0.11.0"
