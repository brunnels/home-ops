# mise uninstall $(mise ls --installed --json | jq -r 'to_entries[] | .key as $tool | .value[] | select(.active == false) | "\($tool)@\(.version)"')

[env]
#_.python.venv = { path = "{{config_root}}/.venv", create = true } # required:template
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
#python = "3.13.0"                         # required:template
#uv = "0.11.29"                            # required:template
#pipx = "1.15.0"                           # required:template
#"pipx:makejinja" = "2.8.2"                # required:template
age = "1.3.1"
#cloudflared = "2026.7.2"
#cue = "0.17.1"                            # required:template
flux2 = "2.9.4"
gh = "2.98.0"
gum = "2.0.0"
helm = "4.2.4"
helmfile = "1.7.4"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kustomize = "5.8.1"
lefthook = "2.1.12"
#sd = "1.1.0"                              # required:template
sops = "3.13.3"
talhelper = "3.1.17"
talosctl = "1.13.9"
yamlfmt = "0.21.0"
yq = "4.53.6"
zizmor = "1.29.0"
envsubst = "1.4.3"
"aqua:mitsuhiko/minijinja" = "2.24.0"
oxfmt = "0.65.0"
"aqua:go-task/task" = "latest"
"github:home-operations/flate" = "v0.6.1"

[hooks]
postinstall = "lefthook install"
