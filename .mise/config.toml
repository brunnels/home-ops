# mise cleanup command
# mise uninstall $(mise ls --installed --json | jq -r 'to_entries[] | .key as $tool | .value[] | select(.active == false) | "\($tool)@\(.version)"')

min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
age = "1.3.2"
"aqua:mitsuhiko/minijinja" = "2.24.0"
envsubst = "1.4.3"
"github:home-operations/flate" = "v0.6.5"
flux2 = "2.9.5"
gh = "2.101.0"
gum = "2.0.1"
helm = "4.3.0"
helmfile = "1.8.0"
jq = "1.8.2"
just = "1.58.0"
kubeconform = "0.8.0"
kubectl = "1.37.0"
kustomize = "5.8.1"
lefthook = "2.1.14"
node = "24.21.0"
oxfmt = "0.70.0"
sops = "latest"
talosctl = "1.14.1"
"github:postfinance/topf" = "v0.6.0"
yamlfmt = "0.21.0"
yq = "4.53.6"
zizmor = "1.30.1"

[settings]
lockfile_platforms = ["linux-x64"]

[hooks]
postinstall = "lefthook install"
