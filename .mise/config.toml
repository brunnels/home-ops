# mise cleanup command
# mise uninstall $(mise ls --installed --json | jq -r 'to_entries[] | .key as $tool | .value[] | select(.active == false) | "\($tool)@\(.version)"')

min_version = "2026.7.0"

[env]
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_CONFIG = "{{config_root}}/.sops.yaml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
JUST_UNSTABLE = "1"

[tools]
actionlint = "1.7.12"
age = "1.3.2"
"aqua:mitsuhiko/minijinja" = "3.0.3"
envsubst = "1.4.3"
flux2 = "2.9.6"
gh = "2.103.2"
"github:home-operations/flate" = "v0.6.5"
"github:postfinance/topf" = "v0.6.2"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.2"
jq = "1.8.2"
just = "1.59.0"
kubeconform = "0.8.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
node = "24.22.1"
oxfmt = "0.74.0"
sops = "latest"
talosctl = "1.14.5"
yamlfmt = "0.21.0"
yq = "4.54.1"
zizmor = "1.31.1"

[settings]
lockfile_platforms = ["linux-x64"]

[hooks]
postinstall = "lefthook install"
