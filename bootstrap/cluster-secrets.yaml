---
# minimum cluster-secrets needed to bootstrap the cluster
apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: "${NAMESPACE}"
stringData:
  SECRET_DOMAIN: "ak://${VAULT_PREFIX}-cluster/SECRET_DOMAIN"
  CLOUDFLARE_TUNNEL_ID: "ak://${VAULT_PREFIX}-cluster/CLOUDFLARE_TUNNEL_ID"
