---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatch
spec:
  dataFrom:
    - extract:
        key: ${VAULT_PREFIX}/dispatch
    - extract:
        key: github
    - extract:
        key: ${VAULT_PREFIX}/omniroute
    - extract:
        key: ai-pguser-dispatch
      sourceRef:
        storeRef:
          kind: SecretStore
          name: ai-secrets
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        DISPATCH_AGENT_TOKEN: "{{ .DISPATCH_AGENT_TOKEN }}"
        DISPATCH_LLM_API_KEY: "{{ .FOREMAN_API_KEY }}"
        DISPATCH_OIDC_CLIENT_ID: "{{ .DISPATCH_OIDC_CLIENT_ID }}"
        DISPATCH_OIDC_CLIENT_SECRET: "{{ .DISPATCH_OIDC_CLIENT_SECRET }}"
        GITHUB_TOKEN: "{{ .GITHUB_FOREMAN_TOKEN }}"
        NEXTAUTH_SECRET: "{{ .NEXTAUTH_SECRET }}"
        DATABASE_URL: '{{ index . "uri" }}?sslmode=require'
