---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      exo:
        initContainers:
          install-exo:
            image:
              repository: docker.io/library/node
              tag: latest
            env:
              CARGO_HOME: /usr/local/cargo
              RUSTUP_HOME: /usr/local/rustup
              PATH: /usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin
            command: ["/bin/sh", "-c"]
            args:
              - /scripts/install.sh

        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: latest
            workingDir: /home/exo
            command: ["sh", "-c", "tail -f /dev/null"]
            #command: ["/bin/sh", "-c"]
            #args: ["/root/.local/bin/uv run exo"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 52415
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 4Gi
        pod:
          runtimeClassName: nvidia
    service:
      app:
        ports:
          http:
            port: 52415
    configMaps:
      install-script:
        data:
          install.sh: |
            #!/bin/sh
            set -e
            echo "=== Installing dependencies ==="
            apt-get update -y && apt-get install -y git curl build-essential

            echo "=== Installing Rust toolchain ==="
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
            fi

            # Source the cargo environment from wherever rustup created it
            if [ -f "/usr/local/cargo/env" ]; then
              . "/usr/local/cargo/env"
            elif [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi

            echo "=== Installing Astral UV ==="
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            export PATH="/usr/local/cargo/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

            echo "=== Fetching Exo repository ==="
            if [ ! -d "/home/exo/.git" ]; then
              git clone https://github.com/exo-explore/exo /home/exo
            else
              cd /home/exo && git pull
            fi

            echo "=== Syncing Python dependencies ==="
            cd /home/exo
            uv sync

            echo "=== Building Exo Dashboard UI ==="
            cd /home/exo/dashboard
            npm install
            npm run build

            echo "=== Installation complete ==="
    persistence:
      install-script:
        type: configMap
        identifier: install-script
        defaultMode: 0755
        advancedMounts:
          exo:
            install-exo:
              - path: /scripts/install.sh
                subPath: install.sh
                readOnly: true
      app-volume:
        type: emptyDir
        globalMounts:
          - path: /home/exo
      cargo-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/local/cargo
      rustup-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/local/rustup
