---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      exo:
        initContainers:
          install-exo:
            image:
              repository: docker.io/library/node
              tag: latest
            env:
              CARGO_HOME: /usr/local/cargo
              RUSTUP_HOME: /usr/local/rustup
              PATH: /usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin
          command:
            - /bin/sh
            - /scripts/install.sh

        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: latest
            workingDir: /home/exo
            command: ["/bin/sh", "-c"]
            args: ["/root/.local/bin/uv run exo"]
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 52415
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 4Gi
    service:
      app:
        ports:
          http:
            port: 52415
    configMaps:
      install-script:
        data:
          install.sh: |
            set -e
            curl -LsSf https://astral.sh | sh
            curl --proto '=https' --tlsv1.2 -sSf https://rustup.rs | sh -s -- -y --default-toolchain nightly
            git clone https://github.com /home/exo
            cd /home/exo && $HOME/.local/bin/uv sync
            cd /home/exo/dashboard && npm install && npm run build
    persistence:
      install-script:
        type: configMap
        identifier: install-script
        defaultMode: 0755
        advancedMounts:
          exo:
            install-exo:
              - path: /scripts/install.sh
                subPath: install.sh
                readOnly: true
      app-volume:
        type: emptyDir
        globalMounts:
          - path: /home/exo
      cargo-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/local/cargo
      rustup-cache:
        type: emptyDir
        globalMounts:
          - path: /usr/local/rustup
