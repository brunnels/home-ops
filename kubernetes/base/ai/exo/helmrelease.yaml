---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exo
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    configMaps:
      install-script:
        data:
          install.sh: |
            #!/bin/sh
            set -e
            echo "=== Installing dependencies ==="
            apt-get update -y && apt-get install -y git curl build-essential

            echo "=== Installing Rust toolchain ==="
            if ! command -v rustup >/dev/null 2>&1; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
            fi

            # Source the cargo environment from wherever rustup created it
            if [ -f "/usr/local/cargo/env" ]; then
              . "/usr/local/cargo/env"
            elif [ -f "$HOME/.cargo/env" ]; then
              . "$HOME/.cargo/env"
            fi

            echo "=== Installing Astral UV ==="
            if ! command -v uv >/dev/null 2>&1; then
              curl -LsSf https://astral.sh/uv/install.sh | sh
            fi
            export PATH="/usr/local/cargo/bin:$HOME/.local/bin:$HOME/.cargo/bin:$PATH"

            #echo "=== Fetching Exo repository ==="
            #if [ ! -d "/home/exo/.git" ]; then
            #  git clone https://github.com/exo-explore/exo /home/exo
            #else
            #  cd /home/exo && git pull
            #fi

            echo "=== Fetching Exo repository (brydenver2/exo:copilot/merge-gpu-support-features) ==="
            if [ ! -d "/home/exo/.git" ]; then
              git clone -b copilot/merge-gpu-support-features https://github.com/brydenver2/exo /home/exo
            else
              cd /home/exo
              git fetch origin
              git checkout copilot/merge-gpu-support-features
              git pull origin copilot/merge-gpu-support-features
            fi

            echo "=== Syncing Python dependencies ==="
            cd /home/exo
            uv sync

            echo "=== Building Exo Dashboard UI ==="
            cd /home/exo/dashboard
            npm install
            npm run build

            echo "=== Installation complete ==="
    controllers:
      exo:
        pod:
          runtimeClassName: nvidia
          terminationGracePeriodSeconds: 5
        initContainers:
          install-exo:
            image:
              repository: docker.io/library/node
              tag: latest
            args:
              - /scripts/install.sh
            command: ["/bin/sh", "-c"]
            env:
              CARGO_HOME: /usr/local/cargo
              PATH: /usr/local/cargo/bin:/usr/local/bin:/usr/bin:/bin
              RUSTUP_HOME: /usr/local/rustup
              UV_LINK_MODE: copy

        containers:
          app:
            image:
              repository: docker.io/library/node
              tag: latest
            args:
              - |
                export PATH="/usr/local/cargo/bin:/root/.cargo/bin:/root/.local/bin:$PATH" \
                && cd /home/exo \
                && uv run exo
            command: ["/bin/sh", "-c"]

            #probes:
            #  liveness:
            #    enabled: true
            #    custom: true
            #    spec:
            #      tcpSocket:
            #        port: 52415
            resources:
              requests:
                cpu: 1000m
                memory: 2Gi
              limits:
                memory: 16Gi
            workingDir: /home/exo
    persistence:
      install-script:
        type: configMap
        defaultMode: 755
        identifier: install-script
        advancedMounts:
          exo:
            install-exo:
              - path: /scripts/install.sh
                readOnly: true
                subPath: install.sh

      exo-data:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        enabled: true
        size: 50Gi
        storageClass: openebs-hostpath
        globalMounts:
          - path: /home/exo
            subPath: exo
          - path: /usr/local/cargo
            subPath: cargo
          - path: /usr/local/rustup
            subPath: rustup
          - path: /root/.local
            subPath: uv
    route:
      app:
        hostnames:
          - exo.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    service:
      app:
        ports:
          http:
            port: 52415
