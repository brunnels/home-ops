---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name foreman-agent
spec:
  dataFrom:
    - extract:
        key: ${VAULT_PREFIX}/context7
    - extract:
        key: github
    - extract:
        key: ${VAULT_PREFIX}/omniroute
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        CONTEXT7_API_KEY: "{{ .CONTEXT7_API_KEY }}"
        GITHUB_FOREMAN_TOKEN: "{{ .GITHUB_FOREMAN_TOKEN }}"
        OMNIROUTE_API_KEY: "{{ .FOREMAN_API_KEY }}"
