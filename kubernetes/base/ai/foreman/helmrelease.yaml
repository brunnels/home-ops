---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name foreman
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    foreman:
      # CRD status metrics (#1001/#1086): renders the chart's CRS ConfigMap,
      # Grafana dashboard, and PrometheusRule. kube-state-metrics consumes the
      # same resource definitions via kube-prometheus-stack values (KSM cannot
      # mount a ConfigMap across namespaces).
      crs:
        enabled: true
        # Render the CRS ConfigMap where the cluster kube-state-metrics can
        # mount it (0.9.17, LLMKube#1492).
        namespace: observability
        alerts:
          enabled: true
    operator:
      # Audit-record ConfigMaps (foreman.llmkube.dev/audit) accumulate one per
      # task and are only GC'd by the operator's reaper. Default retention is 7d;
      # trim to 48h — a homelab does not need a week of audit trail, and heavy
      # task churn otherwise piles up hundreds of CMs (#990).
      audit:
        retention: 48h
    # Defaults every entry in `agents` merges over (LLMKube#994).
    agent:
      mode: native
      taskNamespace: ai
      image:
        repository: ghcr.io/misospace/llmkube-coder
        tag: 0.9.24@sha256:27bb335e0bd41d6c692661248db32281fb1d76be68464043d969d6cae0586a8c
      gateCache:
        storageClass: nfs-slow
        accessModes: ["ReadWriteMany"]
    agents:
      default:
        enabled: true
        # Replicas cap in-process work only. Job-mode tasks select a node
        # without reserving it (#1496), so they are not capped by this: one
        # FleetNode was observed carrying two Job-mode coders and a review
        # concurrently. Concurrent coders are capped by the bridge's
        # CODER_AGENT_SLOTS instead. The only in-process consumer here is the
        # reviewer, and its backend runs --parallel 2, so a third concurrent
        # review would queue at the GPU regardless.
        replicaCount: 2
        roles:
          - worker
          - coder
          - verifier
        githubToken:
          secretName: foreman-agent
          secretKey: GITHUB_FOREMAN_TOKEN
        commitAuthorName: Saffron
        commitAuthorEmail: 263493777+itsmiso-ai@users.noreply.github.com
        gateCache:
          name: foreman-gate-cache
      llmkube:
        enabled: true
        replicaCount: 1
        # Custom roles so the WHOLE pipeline (code -> verify -> review -> PR) runs
        # on this fork-pinned agent and clones/pushes the fork — misospace work
        # (roles coder/verifier/worker) never lands here. coder-go, gate-fork, and
        # reviewer-fork target these. Roles are scheduling-only; native mode + the
        # coder image + gitRemoteURL are what let it execute the tasks.
        roles:
          - coder-fork
          - verifier-fork
          - reviewer-fork
        # Clones AND pushes this fork; the reviewer opens a cross-repo PR into the
        # upstream repo named by the Workload (brunnels/LLMKube).
        gitRemoteURL: https://github.com/brunnels/LLMKube
        # brunnels PAT (can push to the brunnels/LLMKube fork); DCO sign-off +
        # attribution as brunnels to match.
        commitAuthorName: Benjamin Runnels
        commitAuthorEmail: ${GITHUB_EMAIL}
        githubToken:
          secretName: foreman-agent
          secretKey: GITHUB_FOREMAN_TOKEN
        coderGitSecret: foreman-agent
        coderGitSecretKey: GITHUB_FOREMAN_TOKEN
        gateCache:
          name: foreman-llmkube-gate-cache
        # reviewer-fork runs InProcess in this pod; the chart default caps CPU at
        # 2, which throttles review. Burst to 6 cores.
        resources:
          requests:
            cpu: "2"
            memory: 512Mi
          limits:
            cpu: "6"
            memory: 8Gi
    coder:
      gitCredentialsSecret: foreman-agent
      gitCredentialsSecretKey: GITHUB_FOREMAN_TOKEN
