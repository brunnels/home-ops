---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kuberay-operator
spec:
  chart:
    spec:
      chart: *app
      version: 1.2.0
      sourceRef:
        kind: HelmRepository
        name: *app
  interval: 1h
  values:
    singleNamespaceInstall: true
