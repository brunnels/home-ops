---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name litellm-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *name
  interval: 1h
  values:
    controller:
      leaderElection:
        enabled: true
      logLevel: info
    llmkube:
      autoRegister: true
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 25m
        memory: 128Mi
