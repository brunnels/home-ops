---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/modelrouter_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: ModelRouter
metadata:
  name: agent-gateway
spec:
  modelName: agent-core-model
  backends:
    - name: local-rtx3050-pool
      type: InferenceService
      inferenceServiceRef:
        name: llama-nvidia-qwen3-8b-q4
      weight: 100
  rules:
    - name: default-agent-routing
      match:
        - path: /v1/chat/completions
      backendRef: local-rtx3050-pool
      timeout: 15m
