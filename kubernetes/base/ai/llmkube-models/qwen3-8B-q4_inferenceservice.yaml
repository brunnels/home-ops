---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia-qwen3-8b-q4
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-nvidia-qwen3-8b-q4
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:34fb4d3f822d3270fd780a9a28900ad5c0adfd86bbc5e9ec4eb84a53aeb743d3
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  replicas: 3
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 40960
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 512
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  containerPort: &port 9931
  reasoningBudget: 32768
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: 500m
    memory: 8Gi
  extraArgs:
    - --alias
    - Qwen3-8B-GGUF
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --cache-prompt
    - --cache-ram
    - "40960"
    - --kv-unified
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - mmap
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --n-predict
    - "40960"
  endpoint:
    port: *port
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: *port
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: *port
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: *port
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
