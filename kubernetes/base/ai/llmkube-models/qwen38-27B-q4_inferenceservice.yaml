---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: llama-nvidia-qwen38-27b-q4
  labels:
    krr/ignore: "true"
spec:
  modelRef: llama-nvidia
  runtime: llamacpp
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:45047ae940975851c3b195997c91f6bb4add4b941880d94287e5f21ff5a6369a
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  replicas: 1
  priorityClassName: gpu-preemptible
  runtimeClassName: nvidia
  nodeSelector:
    topology.kubernetes.io: egpu
  env:
    - name: NVIDIA_DRIVER_CAPABILITIES
      value: compute,utility
  contextSize: 140000
  flashAttention: true
  jinja: true
  parallelSlots: 1
  batchSize: 4096
  uBatchSize: 512
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  reasoningBudget: 32768
  reasoningBudgetMessage: "Stop reasoning and produce the implementation, tool call, or final answer."
  resources:
    gpu: 1
    cpu: "500m"
    memory: 16Gi
  extraArgs:
    - --alias
    - llama-nvidia
    - --no-mmproj-offload
    - --image-min-tokens
    - "1024"
    - --cont-batching
    - --spec-type
    - draft-mtp
    - --spec-draft-p-min
    - "0.75"
    - --spec-draft-n-max
    - "3"
    - --spec-draft-type-k
    - q8_0
    - --spec-draft-type-v
    - q8_0
    - -sps
    - "0.75"
    - --cache-prompt
    - --cache-ram
    - "40960"
    - --kv-unified
    - --temp
    - "1"
    - --top-p
    - "0.95"
    - --top-k
    - "20"
    - --min-p
    - "0"
    - --presence-penalty
    - "0"
    - --repeat-penalty
    - "1"
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --mmap
    - --chat-template-kwargs
    - '{"reasoning_effort":"medium"}'
    - --n-predict
    - "40960"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
