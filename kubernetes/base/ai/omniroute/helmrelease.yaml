---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omniroute
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      omniroute:
        initContainers:
          copy-tmpfs:
            image:
              repository: ghcr.io/diegosouzapw/omniroute
              tag: main-web@sha256:d02b8efe35c24bd575722a3f454270d5f8a8f7fd3f13f1df9bfa8a059f61577f
            command:
              - sh
              - -c
              - find /tmp -mindepth 1 -maxdepth 1 -exec cp -r {} /tmpfs-mount/ \; 2>/dev/null || true
            volumeMounts:
              - name: tmpfs
                path: /tmpfs-mount
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image:
              repository: ghcr.io/diegosouzapw/omniroute
              tag: main-web@sha256:d02b8efe35c24bd575722a3f454270d5f8a8f7fd3f13f1df9bfa8a059f61577f
            env:
              NODE_ENV: production
              PORT: &port 20128
              REDIS_URL: redis://${NAMESPACE}-dragonfly:6379
              NEXT_PUBLIC_BASE_URL: &hostname https://omniroute.${SECRET_DOMAIN}
              LIVE_WS_HOST: 0.0.0.0
              LIVE_WS_ALLOWED_ORIGINS: *hostname
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - omniroute.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          omniroute:
            app:
              - path: /app/.build/next/cache
                subPath: cache
              - path: /tmp
                subPath: tmp
            copy-tmpfs:
              - path: /tmpfs-mount
                subPath: tmp
