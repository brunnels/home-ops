---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      open-webui:
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: main@sha256:c792953395b43d4f49085fa4026850c5e923578345ebeaf56eabd980bcfc273a
            env:
              CORS_ALLOW_ORIGIN: https://chat.${SECRET_DOMAIN}
              ENABLE_LOGIN_FORM: false
              ENABLE_OAUTH_SIGNUP: true
              ENABLE_OLLAMA_API: false
              ENABLE_OPENAI_API: true
              ENABLE_PERSISTENT_CONFIG: false
              ENABLE_SEARCH_QUERY_GENERATION: true
              ENABLE_SIGNUP: false
              ENABLE_WEB_SEARCH: true
              ENABLE_WEBSOCKET_SUPPORT: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              OAUTH_PROVIDER_NAME: Authelia
              OAUTH_SCOPES: "openid profile email groups"
              OAUTH_UPDATE_PICTURE_ON_LOGIN: true
              OPENAI_API_BASE_URL: https://omniroute.${SECRET_DOMAIN}/api/v1
              OPENID_PROVIDER_URL: https://auth.${SECRET_DOMAIN}/.well-known/openid-configuration
              OPENID_REDIRECT_URI: https://chat.${SECRET_DOMAIN}/oauth/oidc/callback
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://${NAMESPACE}-dragonfly:6379
              WEBUI_NAME: "${VAULT_PREFIX} AI"
              WEBUI_SESSION_COOKIE_SAME_SITE: lax
              WEBUI_SESSION_COOKIE_SECURE: true
              WEBUI_URL: https://chat.${SECRET_DOMAIN}
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /health
                    port: &port 8080
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 30
                  httpGet: *httpGet
                  initialDelaySeconds: 10
                  periodSeconds: 5
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/backend/data
      tmpfs:
        type: emptyDir
        advancedMounts:
          open-webui:
            app:
              - path: /tmp
                subPath: tmp
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Development
          gethomepage.dev/icon: https://docs.openwebui.com/img/logo-dark.png
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/pod-selector: app.kubernetes.io/component=open-webui
        hostnames:
          - chat.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        controller: *app
        ports:
          http:
            port: *port
