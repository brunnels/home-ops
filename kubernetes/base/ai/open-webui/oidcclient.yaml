---
# yaml-language-server: $schema=https://brunnels.github.io/authelia-oidc-operator/authelia.milas.dev/oidcclient_v1alpha2.json
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: &name open-webui
  annotations:
    authelia.milas.dev/oidc-provider: security/default
spec:
  description: Open Web-UI
  preconfigured_consent_duration: 1y
  redirect_uris:
    - https://chat.${SECRET_DOMAIN}/oauth/oidc/callback
  response_types:
    - code
  scopes:
    - email
    - openid
    - profile
    - groups
  secret_ref:
    fields:
      client_id: OAUTH_CLIENT_ID
      client_secret: OAUTH_CLIENT_SECRET
    name: *name
  # default should not be needed, but it is required for the operator to work issue: #6
  token_endpoint:
    auth_method: client_secret_basic
