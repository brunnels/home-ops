---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr-mcp
spec:
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SONARR_URL
      value: https://sonarr.kraven.org
    - name: RADARR_URL
      value: https://radarr.kraven.org
    - name: PROWLARR_URL
      value: https://prowlarr.kraven.org
  groupRef:
    name: mcp-tools
  image: docker.io/node:24-alpine
  podTemplateSpec:
    spec:
      containers:
        - args:
            - -y
            - mcp-arr-server@1.5.4
          command:
            - npx
          image: docker.io/node:24-alpine
          name: mcp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  secrets:
    - key: SONARR_API_KEY
      name: toolhive-sonarr
      targetEnvName: SONARR_API_KEY
    - key: RADARR_API_KEY
      name: toolhive-radarr
      targetEnvName: RADARR_API_KEY
    - key: PROWLARR_API_KEY
      name: toolhive-prowlarr
      targetEnvName: PROWLARR_API_KEY
  transport: stdio
