---
# yaml-language-server: $schema=https://brunnels.github.io/authelia-oidc-operator/authelia.milas.dev/oidcclient_v1alpha2.json
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: &name toolhive-ui
  annotations:
    authelia.milas.dev/oidc-provider: security/default
spec:
  description: Toolhive UI
  grant_types:
    - authorization_code
  pkce_challenge_method: S256
  preconfigured_consent_duration: 1y
  redirect_uris:
    - https://toolhive.${SECRET_DOMAIN}/api/auth/oauth2/callback/oidc
  require_pkce: true
  response_types:
    - code
  scopes:
    - offline_access
    - email
    - openid
    - profile
  secret_ref:
    name: *name
    fields:
      client_id: OIDC_CLIENT_ID
      client_secret: OIDC_CLIENT_SECRET
