        #  #env:
        #  #  - name: PYTORCH_CUDA_ALLOC_CONF
        #  #    value: "expandable_segments:True"
        #
        #  vllmConfig:
        #    #tensorParallelSize: 1
        #    #pipelineParallelSize: 3
        #    enablePrefixCaching: false
        #    gpuMemoryUtilization: 0.95
        #    maxModelLen: 6144
        #    dtype: bfloat16
        #    extraArgs:
        #      - "--trust-remote-code"
        #      - "--enforce-eager"
        #
        #  hf_token:
        #    secretName: *app
        #    secretKey: HF_TOKEN

        #raySpec:
        #  enabled: true
        #  headNode:
        #    requestCPU: *replicas
        #    requestMemory: 16Gi
        #    requestGPU: 1
        #
        #shmSize: 16Gi
        #
        #lmcacheConfig:
        #  enabled: true
