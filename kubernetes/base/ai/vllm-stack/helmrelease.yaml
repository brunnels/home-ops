---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vllm-stack
spec:
  chart:
    spec:
      chart: *app
      version: 0.1.11
      sourceRef:
        kind: HelmRepository
        name: *app
  interval: 1h
  values:
    servingEngineSpec:
      runtimeClassName: nvidia
      strategy:
        type: Recreate
      modelSpec:
        - name: qwen35
          repository: lmcache/vllm-openai
          tag: latest-nightly
          modelURL: Qwen/Qwen3.5-4B

          replicaCount: 2

          requestCPU: 8
          requestMemory: 16Gi
          requestGPU: 1

          #pvcStorage: 50Gi
          #pvcAccessMode:
          #  - ReadWriteOnce
          #storageClass: openebs-hostpath

          vllmConfig:
            tensorParallelSize: 1
            pipelineParallelSize: 3
            #enablePrefixCaching: true
            #maxModelLen: 4096
            #dtype: bfloat16
            #gpuMemoryUtilization: 0.9
            #extraArgs:
            #  - --disable-log-requests
            #  - --enforce-eager

          #lmcacheConfig:
          #  enabled: true
          #  cpuOffloadingBufferSize: 20

          hf_token:
            secretName: *app
            secretKey: HF_TOKEN

          raySpec:
            enabled: true
            headNode:
              requestCPU: 2
              requestMemory: 16Gi
              requestGPU: 1

          shmSize: 4Gi

    #cacheserverSpec:
    #  replicaCount: 1
    #  containerPort: 8080
    #  servicePort: 81
    #  serde: naive
    #  repository: lmcache/vllm-openai
    #  tag: latest-nightly
    #  resources:
    #    requests:
    #      cpu: 2
    #      memory: 2G
    #    limits:
    #      cpu: 2
    #      memory: 10G
    #  labels:
    #    environment: cacheserver
    #    release: cacheserver
