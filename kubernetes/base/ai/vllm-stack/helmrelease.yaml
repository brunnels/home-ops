---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vllm-stack
spec:
  chart:
    spec:
      chart: *app
      version: 0.1.12
      sourceRef:
        kind: HelmRepository
        name: *app
  interval: 1h
  upgrade:
    force: true
  values:
    cacheserverSpec:
      enabled: true
    grafanaDashboards:
      enabled: true
    prometheus-adapter:
      enabled: false
    routerSpec:
      route:
        main:
          enabled: true
          annotations:
            gatus.home-operations.com/endpoint: |
              name: vllm-api
          hostnames:
            - "vllm-api.${SECRET_DOMAIN}"
          parentRefs:
            - name: envoy-internal
              namespace: network
          matches:
            - path:
                type: PathPrefix
                value: /
      serviceAnnotations:
        gatus.home-operations.com/endpoint: |
          alerts:
            - type: pushover
          group: internal
          name: vllm-api
    servingEngineSpec:
      runtimeClassName: nvidia
      strategy:
        type: Recreate
      modelSpec:
        #- name: "distilgpt2-raycluster"
        #  repository: "lmcache/vllm-openai"
        #  tag: "latest"
        #  modelURL: "distilbert/distilgpt2"
        #
        #  replicaCount: 1
        #
        #  requestCPU: 1
        #  requestMemory: "20Gi"
        #  requestGPU: 1
        #
        #  vllmConfig:
        #    tensorParallelSize: 1
        #    pipelineParallelSize: 2
        #
        #  shmSize: "20Gi"
        #
        #  raySpec:
        #    enabled: true
        #    headNode:
        #      requestCPU: 1
        #      requestMemory: "20Gi"
        #      requestGPU: 1

        - name: intern-vl35-2b-hf
          repository: lmcache/vllm-openai
          tag: latest
          modelURL: OpenGVLab/InternVL3_5-2B-HF

          replicaCount: &replicas 1

          requestCPU: 4
          requestMemory: 16Gi
          requestGPU: 1

          pvcStorage: 50Gi
          pvcAccessMode:
            - ReadWriteOnce
          storageClass: openebs-hostpath

          #env:
          #  - name: PYTORCH_CUDA_ALLOC_CONF
          #    value: "expandable_segments:True"

          vllmConfig:
            #tensorParallelSize: 1
            #pipelineParallelSize: 3
            enablePrefixCaching: false
            gpuMemoryUtilization: 0.95
            #maxModelLen: 2048
            dtype: bfloat16
            extraArgs:
              - "--trust-remote-code"
              - "--enforce-eager"

          hf_token:
            secretName: *app
            secretKey: HF_TOKEN

          #raySpec:
          #  enabled: true
          #  headNode:
          #    requestCPU: *replicas
          #    requestMemory: 16Gi
          #    requestGPU: 1
          #
          #shmSize: 16Gi
          #
          lmcacheConfig:
            enabled: true
            cpuOffloadingBufferSize: "8"

    #  replicaCount: 1
