---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vllm-stack
spec:
  chart:
    spec:
      chart: *app
      sourceRef:
        kind: HelmRepository
        name: *app
      version: 0.1.12
  interval: 1h
  upgrade:
    force: true
  values:
    #cacheserverSpec:
    #  enabled: true
    grafanaDashboards:
      enabled: true
    prometheus-adapter:
      enabled: false
    routerSpec:
      route:
        main:
          annotations:
            gatus.home-operations.com/endpoint: |
              name: vllm-api
          enabled: true
          hostnames:
            - vllm-api.${SECRET_DOMAIN}
          matches:
            - path:
                type: PathPrefix
                value: /
          parentRefs:
            - name: envoy-internal
              namespace: network
      serviceAnnotations:
        gatus.home-operations.com/endpoint: |
          alerts:
            - type: pushover
          group: internal
          name: vllm-api
    servingEngineSpec:
      modelSpec:
        #- name: "distilgpt2-raycluster"
        #  repository: "lmcache/vllm-openai"
        #  tag: "latest"
        #  modelURL: "distilbert/distilgpt2"
        #
        #  replicaCount: 1
        #
        #  requestCPU: 1
        #  requestMemory: "20Gi"
        #  requestGPU: 1
        #
        #  vllmConfig:
        #    tensorParallelSize: 1
        #    pipelineParallelSize: 2
        #
        #  shmSize: "20Gi"
        #
        #  raySpec:
        #    enabled: true
        #    headNode:
        #      requestCPU: 1
        #      requestMemory: "20Gi"
        #      requestGPU: 1
        - hf_token:
            secretKey: HF_TOKEN
            secretName: *app
          modelURL: google/gemma-3-1b-it
          name: gemma-3-1b-it
          pvcStorage: 20Gi
          replicaCount: 1
          repository: vllm/vllm-openai

          # Match your system node resources
          requestCPU: 4
          requestGPU: 1
          requestMemory: 12Gi
          tag: "latest"

          vllmConfig:
            #gpuMemoryUtilization: 0.5
            extraArgs:
              - "--trust-remote-code"
              - "--enforce-eager"
            maxModelLen: 7777
        #- name: intern-vl35-2b-hf
        #  repository: lmcache/vllm-openai
        #  tag: latest
        #  modelURL: OpenGVLab/InternVL3_5-2B-HF
        #
        #  replicaCount: &replicas 1
        #
        #  requestCPU: 4
        #  requestMemory: 16Gi
        #  requestGPU: 1
        #
        #  pvcStorage: 50Gi
        #  pvcAccessMode:
        #    - ReadWriteOnce
        #  storageClass: openebs-hostpath
