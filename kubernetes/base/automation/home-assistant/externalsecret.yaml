---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name home-assistant
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      templateFrom:
        - target: Data
          literal: |-
            {{- $lines := list }}
            {{- $lines = append $lines (printf "%s: %s" "HASS_HTTP_TRUSTED_PROXY_1" "${SERVICE_CIDR}") }}
            {{- $lines = append $lines (printf "%s: %s" "HASS_HTTP_TRUSTED_PROXY_2" "${CLUSTER_CIDR}") }}
            {{- range $key, $val := . }}
              {{- if $key }}
              {{- $lines = append $lines (printf "%s: '%s'" $key $val) }}
              {{- end }}
            {{- end }}
            secrets.yaml: {{ $lines | join "\n" | quote }}
  dataFrom:
    - extract:
        key: "${VAULT_PREFIX}/hass"
  data:
    - secretKey: OPNSENSE_USER
      remoteRef:
        key: "${VAULT_PREFIX}/opnsense"
        property: OPNSENSE_USER
    - secretKey: OPNSENSE_PASS
      remoteRef:
        key: "${VAULT_PREFIX}/opnsense"
        property: OPNSENSE_PASS
