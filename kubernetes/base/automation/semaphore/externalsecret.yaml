---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name semaphore
spec:
  dataFrom:
    - extract:
        key: ${VAULT_PREFIX}/semaphore
    - extract:
        key: smtp2go
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Use the following to generate the next 3
        # base64 <(head /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 32) | base64
        ACCESSKEY_ENCRYPTION_KEY: "{{ .SEMAPHORE_ACCESSKEY_ENCRYPTION_KEY }}"
        COOKIE_HASH_KEY: "{{ .SEMAPHORE_COOKIE_HASH_KEY }}"
        COOKIE_ENCRYPTION_KEY: "{{ .SEMAPHORE_COOKIE_ENCRYPTION_KEY }}"
        SEMAPHORE_OIDC_CLIENT_ID: "{{ .SEMAPHORE_OIDC_CLIENT_ID }}"
        SEMAPHORE_OIDC_CLIENT_SECRET: "{{ .SEMAPHORE_OIDC_CLIENT_SECRET }}"
        SMTP_USER: "{{ .SMTP_USER }}"
        SMTP_PASSWORD: "{{ .SMTP_PASS }}"
