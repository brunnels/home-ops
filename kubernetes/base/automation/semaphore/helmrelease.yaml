---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app semaphore
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    fullnameOverride: *app
    annotations:
      reloader.stakater.com/auto: "true"
    image:
      repository: docker.io/semaphoreui/semaphore
      tag: v2.19.14
    extraEnvVariables:
      SEMAPHORE_SCHEDULE_TIMEZONE: ${TIMEZONE}
      ANSIBLE_HOST_KEY_CHECKING: false
    general:
      host: &host https://semaphore.${SECRET_DOMAIN}
      tmp_path: /tmp/semaphore/
      passwordLoginDisable: true
      sshConfigPath: /tmp/semaphore/.ssh/config
    secrets:
      accesskeyEncryptionKey: ACCESSKEY_ENCRYPTION_KEY
      cookieEncryptionKey: COOKIE_ENCRYPTION_KEY
      cookieHashKey: COOKIE_HASH_KEY
      existingSecret: *app
    postgresql:
      enabled: false
    database:
      type: postgres
      name: *app
      usernameFromSecret: true
      usernameKey: user
      passwordKey: password
      existingSecret: &pguserSecret ${NAMESPACE}-pguser-semaphore
    persistence:
      enabled: true
      existingClaim: *app
    oidc:
      enable: true
      providers:
        authelia:
          display_name: Login with Authelia
          provider_url: https://auth.${SECRET_DOMAIN}
          redirect_url: https://semaphore.${SECRET_DOMAIN}/api/auth/oidc/authelia/redirect
          #"endpoint": {
          #  "auth": "https://auth.${SECRET_DOMAIN}/api/oidc/authorization",
          #  "token": "https://auth.${SECRET_DOMAIN}/api/oidc/token",
          #  "userinfo": "https://auth.${SECRET_DOMAIN}/api/oidc/userinfo"
          #}
          username_claim: preferred_username
          name_claim: name
          email_claim: email
          color: red darken-4
          icon: openid
          scopes:
            - email
            - groups
            - openid
            - profile
    email:
      alert: true
      host: mail.smtp2go.com
      port: 2525
      sender: "Semaphore <semaphore@${SECRET_DOMAIN}>"
      usernameKey: SMTP_USER
      passwordKey: SMTP_PASSWORD
      existingSecret: *app
    ldap:
      enable: false
    service:
      type: ClusterIP
      port: &port 3000
      internalPort: *port
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 5m
        memory: 50M
      limits:
        memory: 1Gi
  valuesFrom:
    - kind: Secret
      name: *pguserSecret
      valuesKey: pgbouncer-host
      targetPath: database.host
    - kind: Secret
      name: *pguserSecret
      valuesKey: dbname
      targetPath: database.name
    - kind: Secret
      name: *pguserSecret
      valuesKey: port
      targetPath: database.port
    - kind: Secret
      name: *app
      valuesKey: SEMAPHORE_OIDC_CLIENT_ID
      targetPath: oidc.providers.authelia.client_id
    - kind: Secret
      name: *app
      valuesKey: SEMAPHORE_OIDC_CLIENT_SECRET
      targetPath: oidc.providers.authelia.client_secret
