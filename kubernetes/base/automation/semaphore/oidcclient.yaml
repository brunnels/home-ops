---
# yaml-language-server: $schema=https://brunnels.github.io/authelia-oidc-operator/authelia.milas.dev/oidcclient_v1alpha2.json
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: &name semaphore
  annotations:
    authelia.milas.dev/oidc-provider: security/default
spec:
  description: Semaphore
  preconfigured_consent_duration: 1y
  redirect_uris:
    - https://semaphore.${SECRET_DOMAIN}/api/auth/oidc/authelia/redirect
  response_types:
    - code
  scopes:
    - email
    - groups
    - openid
    - profile
  secret_ref:
    name: *name
    fields:
      client_id: SEMAPHORE_OIDC_CLIENT_ID
      client_secret: SEMAPHORE_OIDC_CLIENT_SECRET
  token_endpoint:
    auth_method: client_secret_post
