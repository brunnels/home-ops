---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bookshelf
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      bookshelf:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: hardcover-v0.4.20.91@sha256:fd6183d0eacf1cac6ce3a0c8ff2b0d5af9ddf2101141f6c86c928a136c9b2d95
            command:
              - "/usr/bin/catatonit"
              - "--"
              - "sh"
              - "-c"
              - |
                exec /app/readarr/bin/Readarr \
                  --nobrowser \
                  --data=/config \
                  "$@"
            env:
              TZ: "${TIMEZONE}"
              READARR__APP__INSTANCENAME: Bookshelf
              READARR__APP__THEME: dark
              READARR__AUTH__METHOD: External
              READARR__AUTH__REQUIRED: DisabledForLocalAddresses
#              READARR__LOG__DBENABLED: "False"
              READARR__LOG__LEVEL: info
              READARR__POSTGRES__CACHEDB: bookshelf-cache
              READARR__POSTGRES__HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              READARR__POSTGRES__LOGDB: bookshelf-log
              READARR__POSTGRES__MAINDB: *app
              READARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
                    key: password
              READARR__POSTGRES__PORT: 5432
              READARR__POSTGRES__USER: *app
              READARR__SERVER__PORT: &port 80
              READARR__UPDATE__BRANCH: develop
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 2.5Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Bookshelf
          gethomepage.dev/icon: *app
          gethomepage.dev/description: eBook Downloads
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://bookshelf.{{ .Release.Namespace }}"
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_READARR_TOKEN}}` }}"
        hostnames:
          - "bookshelf.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      books:
        globalMounts:
          - path: /media/books
        path: /books
        server: ${QNAP_HOSTNAME}
        type: nfs
      config:
        existingClaim: *app
      downloads:
        advancedMounts:
          bookshelf:
            app:
              - path: /downloads/downloaded_books
                subPath: sabnzbd/downloaded_books
              - path: /downloads/books-readarr
                subPath: flood/books-readarr
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        type: nfs
      run:
        type: emptyDir
        medium: Memory
      tmp:
        type: emptyDir
