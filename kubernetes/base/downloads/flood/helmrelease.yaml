---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flood
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      flood:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/jesec/flood
              tag: 4.14.3@sha256:c887dad96b40a37fa86d4d77a409dd06220b849c6a8b7d0e2c3ae6dd033deea3
            env:
              FLOOD_OPTION_noauth: "true"
              FLOOD_OPTION_port: &port 80
              FLOOD_OPTION_rundir: /data
              FLOOD_OPTION_trpass: none
              FLOOD_OPTION_trurl: http://flood:9091/transmission/rpc
              FLOOD_OPTION_truser: none
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          transmission:
            image:
              repository: ghcr.io/home-operations/transmission
              tag: 4.1.3@sha256:bf99b6d4abbda8a027d985a0830f2f2352cb027263e1641f60158276a9d24987
            env:
              TRANSMISSION__IDLE_SEEDING_LIMIT: 10080
              TRANSMISSION__IDLE_SEEDING_LIMIT_ENABLED: true
              TRANSMISSION__INCOMPLETE_DIR: /incomplete
              TRANSMISSION__RATIO_LIMIT: 1
              TRANSMISSION__RATIO_LIMIT_ENABLED: true
              TRANSMISSION__UTP_ENABLED: false
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          exporter:
            dependsOn: app
            image:
              repository: ghcr.io/frantathefranta/transmission-exporter
              tag: 0.3.2@sha256:26d149c4f9fb574e847b27348302e0abcd1cdc7e3a5b957e393c76d81c68b2bc
            env:
              TRANSMISSION_ADDR: http://flood:9091
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 50Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      hostname: *app
      labels:
        use-vpn-gateway: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        controller: *app
        ports:
          http:
            port: *port
          rpc:
            port: 9091
          metrics:
            port: 19091
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      flood:
        forceRename: flood
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Flood
          gethomepage.dev/icon: *app
          gethomepage.dev/description: Bittorrent UI
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://flood.{{ .Release.Namespace }}"
        hostnames:
          - "flood.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *port
      public:
        hostnames:
          - "flood.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /manifest.json
              - path:
                  type: Exact
                  value: /favicon.ico
            backendRefs:
              - identifier: app
                port: *port

    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          flood:
            app:
              - path: /data
                subPath: flood-data
      transmission-config:
        type: emptyDir
        advancedMounts:
          flood:
            transmission:
              - path: /config
      downloads:
        advancedMounts:
          flood:
            app:
              - path: /downloads
                subPath: *app
            transmission:
              - path: /downloads
                subPath: *app
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        type: nfs
      incomplete:
        advancedMounts:
          flood:
            app:
              - path: /incomplete
                subPath: *app
            transmission:
              - path: /incomplete
                subPath: *app
        path: /downloads/${VAULT_PREFIX}/incomplete
        server: ${QNAP_HOSTNAME}
        type: nfs
      tmp:
        type: emptyDir
