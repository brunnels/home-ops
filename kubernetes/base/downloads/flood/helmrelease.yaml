---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flood
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      flood:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/jesec/flood
              tag: 4.12.6@sha256:87259979d6ff581e463491475ccf22013775066e6c44c1051a88db8dd9644159
            env:
              TZ: "${TIMEZONE}"
              FLOOD_OPTION_noauth: "true"
              FLOOD_OPTION_port: &port 80
              FLOOD_OPTION_rundir: /data
              FLOOD_OPTION_trurl: http://flood:9091/transmission/rpc
              FLOOD_OPTION_truser: none
              FLOOD_OPTION_trpass: none
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          transmission:
            image:
              repository: ghcr.io/home-operations/transmission
              tag: 4.1.0@sha256:52dad1801ad32a064a7fe5c4d2b76251b710815a2d952abeb8a2f722b62990de
            env:
              TZ: "${TIMEZONE}"
              TRANSMISSION__INCOMPLETE_DIR: /incomplete
              TRANSMISSION__IDLE_SEEDING_LIMIT: 10080
              TRANSMISSION__IDLE_SEEDING_LIMIT_ENABLED: true
              TRANSMISSION__RATIO_LIMIT: 1
              TRANSMISSION__RATIO_LIMIT_ENABLED: true
              TRANSMISSION__UTP_ENABLED: false
              TRANSMISSION__PEER_PORT: 14738
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
          exporter:
            dependsOn: app
            image:
              repository: ghcr.io/frantathefranta/transmission-exporter
              tag: 0.3.2@sha256:26d149c4f9fb574e847b27348302e0abcd1cdc7e3a5b957e393c76d81c68b2bc
            env:
              TRANSMISSION_ADDR: http://flood:9091
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 50Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      hostname: *app
      labels:
        use-vpn-gateway: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        controller: *app
        ports:
          http:
            port: *port
          rpc:
            port: 9091
          metrics:
            port: 19091
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "false"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: Flood
          gethomepage.dev/icon: *app
          gethomepage.dev/description: Bittorrent UI
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://flood.{{ .Release.Namespace }}"
        hostnames:
          - "flood.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        existingClaim: *app
        advancedMounts:
          flood:
            app:
              - path: /data
                subPath: flood-data
            transmission:
              - path: /config
                subPath: transmission-config
      downloads:
        advancedMounts:
          flood:
            app:
              - path: /downloads
                subPath: *app
            transmission:
              - path: /downloads
                subPath: *app
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        type: nfs
      incomplete:
        advancedMounts:
          flood:
            app:
              - path: /incomplete
                subPath: *app
            transmission:
              - path: /incomplete
                subPath: *app
        path: /downloads/${VAULT_PREFIX}/incomplete
        server: ${QNAP_HOSTNAME}
        type: nfs
      tmp:
        type: emptyDir
