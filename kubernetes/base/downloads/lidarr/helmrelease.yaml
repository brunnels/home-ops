---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lidarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      lidarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/lidarr
              tag: 3.1.4.5029@sha256:c0825c56238f7702e6572b64ef0f3e3f14be2d4ed10557794eaeb866daa15e34
            env:
              LIDARR__APP__INSTANCENAME: Lidarr
              LIDARR__APP__THEME: dark
              LIDARR__AUTH__METHOD: External
              LIDARR__AUTH__REQUIRED: DisabledForLocalAddresses
              LIDARR__LOG__ANALYTICSENABLED: "False"
              LIDARR__LOG__DBENABLED: "False"
              LIDARR__LOG__LEVEL: info
              LIDARR__POSTGRES__HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              LIDARR__POSTGRES__MAINDB: *app
              LIDARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
              LIDARR__POSTGRES__PORT: 5432
              LIDARR__POSTGRES__USER: *app
              LIDARR__SERVER__PORT: &port 80
              LIDARR__UPDATE__BRANCH: develop
              TZ: ${TIMEZONE}
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 2.5Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      config:
        existingClaim: *app
      downloads:
        type: nfs
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        advancedMounts:
          lidarr:
            app:
              - path: /downloads/complete/downloaded_music
                subPath: sabnzbd/downloaded_music
              - path: /downloads/music-lidarr
                subPath: flood/music-lidarr
      music:
        type: nfs
        path: /music
        server: ${QNAP_HOSTNAME}
        globalMounts:
          - path: /media/music
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/description: Music Downloads
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: *app
          gethomepage.dev/name: Lidarr
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_LIDARR_TOKEN}}` }}"
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://lidarr.{{ .Release.Namespace }}"
        hostnames:
          - lidarr.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: *port
