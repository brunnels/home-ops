---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app radarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 6.4.3.10645@sha256:0ebb4ae26ee9522674a4ad1855e926fd6b97c534ff982644c9c9a87bca740077
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__APP__THEME: dark
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: DisabledForLocalAddresses
              RADARR__LOG__ANALYTICSENABLED: "False"
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__POSTGRES__HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              RADARR__POSTGRES__MAINDB: *app
              RADARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
              RADARR__POSTGRES__PORT: 5432
              RADARR__POSTGRES__USER: *app
              RADARR__SERVER__PORT: &port 80
              RADARR__UPDATE__BRANCH: develop
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 2.5Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    persistence:
      config:
        existingClaim: *app
      downloads:
        type: nfs
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        advancedMounts:
          radarr:
            app:
              - path: /downloads/complete/downloaded_movies
                subPath: sabnzbd/downloaded_movies
              - path: /downloads/movies-radarr
                subPath: flood/movies-radarr
      movies:
        type: nfs
        path: /movies
        server: ${QNAP_HOSTNAME}
        globalMounts:
          - path: /media/movies
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/description: Movie Downloads
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: *app
          gethomepage.dev/name: Radarr
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_RADARR_TOKEN}}` }}"
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://radarr.{{ .Release.Namespace }}"
        hostnames:
          - "radarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: *port
