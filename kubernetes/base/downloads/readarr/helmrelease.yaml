---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app readarr
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      readarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pennydreadful/bookshelf
              tag: hardcover-v0.4.20.107@sha256:d53f1cd8b029c4d2187826fdba87280f95133182a64b97a01f2e9382896f3108
            command:
              - "/usr/bin/catatonit"
              - "--"
              - "sh"
              - "-c"
              - |
                exec /app/readarr/bin/Readarr \
                  --nobrowser \
                  --data=/config \
                  "$@"
            env:
              READARR__APP__INSTANCENAME: Readarr
              READARR__APP__THEME: dark
              READARR__AUTH__METHOD: External
              READARR__AUTH__REQUIRED: DisabledForLocalAddresses
              #              READARR__LOG__DBENABLED: "False"
              READARR__LOG__LEVEL: info
              READARR__POSTGRES__CACHEDB: readarr-cache
              READARR__POSTGRES__HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              READARR__POSTGRES__LOGDB: readarr-log
              READARR__POSTGRES__MAINDB: *app
              READARR__POSTGRES__PASSWORD:
                valueFrom:
                  secretKeyRef:
                    key: password
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
              READARR__POSTGRES__PORT: 5432
              READARR__POSTGRES__USER: *app
              READARR__SERVER__PORT: &port 80
              READARR__UPDATE__BRANCH: develop
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 5
                  httpGet:
                    path: /ping
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
              readiness: *probes
            resources:
              requests:
                cpu: 200m
                memory: 128Mi
              limits:
                memory: 2.5Gi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    persistence:
      books:
        type: nfs
        path: /books
        server: ${QNAP_HOSTNAME}
        globalMounts:
          - path: /media/books
      config:
        existingClaim: *app
      downloads:
        type: nfs
        path: /downloads/${VAULT_PREFIX}/complete
        server: ${QNAP_HOSTNAME}
        advancedMounts:
          readarr:
            app:
              - path: /downloads/complete/downloaded_books
                subPath: sabnzbd/downloaded_books
              - path: /downloads/books-readarr
                subPath: flood/books-readarr
      run:
        type: emptyDir
        medium: Memory
      tmp:
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/description: eBook Downloads
          gethomepage.dev/enabled: "false"
          gethomepage.dev/group: Downloads
          gethomepage.dev/icon: *app
          gethomepage.dev/name: Readarr
          gethomepage.dev/widget.key: "{{ `{{HOMEPAGE_VAR_READARR_TOKEN}}` }}"
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://readarr.{{ .Release.Namespace }}"
        hostnames:
          - "readarr.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: *port
