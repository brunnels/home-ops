---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 4.8.1@sha256:2b7a1714b287f69b081ad2a63bb8c2fa673666a17b2f21322b580b0cd51cb266
            env:
              DB_HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              DB_NAME: *app
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
                    key: password
              DB_PORT: 5432
              DB_USER: *app
#              DISABLE_DOWNLOAD_ENDPOINT_AUTH: true
              DISABLE_USERPASS_LOGIN: true # only set to true after first run and admin has been created
#              ENABLE_SCHEDULED_RESCAN: true
              FLASHPOINT_API_ENABLED: true
              HASHEOUS_API_ENABLED: true
              HLTB_API_ENABLED: true
              IPV4_ONLY: true
              LAUNCHBOX_API_ENABLED: true
              OIDC_ENABLED: true
              OIDC_PROVIDER: authelia
              OIDC_REDIRECT_URI: https://romm.${SECRET_DOMAIN}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://auth.${SECRET_DOMAIN}
              OIDC_USERNAME_ATTRIBUTE: email
              PLAYMATCH_API_ENABLED: true
              REDIS_DB: 5
              REDIS_HOST: "${NAMESPACE}-dragonfly"
              REDIS_PORT: 6379
              ROMM_DB_DRIVER: postgresql
#              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: *app
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Rom emulator
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
          gethomepage.dev/name: Romm
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://romm.{{ .Release.Namespace }}"
        hostnames:
          - "romm.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        type: configMap
        name: *app
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      data:
        existingClaim: *app
        advancedMounts:
          romm:
            app:
              - path: /etc/nginx/conf.d
                subPath: nginx-conf
              - path: /romm/config
                subPath: config
              - path: /romm/resources
                subPath: resources
              - path: /romm/assets
                subPath: assets
      tmp:
        type: emptyDir
      games:
        globalMounts:
          - path: /romm/library
            subPath: romm
        path: /games
        server: ${QNAP_HOSTNAME}
        type: nfs
    configMaps:
      config:
        data:
          config.yml: |-
            exclude:
              platforms: []
              roms:
                single_file:
                  extensions:
                    - "xml"
                    - "txt"
                  names:
                    - "info.txt"
                    - "metadata.txt"
                    - "systeminfo.txt"
                    - "psy.ggjud.iso"
                    - "psy.ggjud.nfo"
                multi_file:
                  names:
                    - "roms"
                    - "pfx"
                    - "mlc01"
                    - ".Trash*"
                  parts:
                    names: []
                    extensions: []
            system:
              platforms: {}
              versions: {}
            filesystem: {}
