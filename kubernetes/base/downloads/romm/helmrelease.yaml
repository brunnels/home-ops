---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app romm
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      romm:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rommapp/romm
              tag: 4.7.0@sha256:652f763dbb1133e4dba37e927353d2790d8afa027521ddeec4b56806d6964d9d
            env:
              DB_HOST: "{{ .Release.Namespace }}-pgbouncer.{{ .Release.Namespace }}.svc"
              DB_NAME: *app
              DB_PASSWD:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Namespace }}-pguser-{{ .Release.Name }}"
                    key: password
              DB_PORT: 5432
              DB_USER: *app
#              DISABLE_DOWNLOAD_ENDPOINT_AUTH: true
#              DISABLE_USERPASS_LOGIN: true # only set to true after first run and admin has been created
#              ENABLE_SCHEDULED_RESCAN: true
              HASHEOUS_API_ENABLED: true
              IPV4_ONLY: true
              OIDC_ENABLED: true
              OIDC_PROVIDER: authelia
              OIDC_REDIRECT_URI: https://romm.${SECRET_DOMAIN}/api/oauth/openid
              OIDC_SERVER_APPLICATION_URL: https://auth.${SECRET_DOMAIN}
              PLAYMATCH_API_ENABLED: true
              REDIS_DB: 5
              REDIS_HOST: "${NAMESPACE}-dragonfly"
              REDIS_PORT: 6379
              ROMM_DB_DRIVER: postgresql
#              SCHEDULED_RESCAN_CRON: "0 3 * * *"
              TZ: "${TIMEZONE}"
            envFrom:
              - secretRef:
                  name: *app
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Rom emulator
          gethomepage.dev/group: Media
          gethomepage.dev/icon: *app
          gethomepage.dev/name: Romm
          gethomepage.dev/widget.type: *app
          gethomepage.dev/widget.url: "http://romm.{{ .Release.Namespace }}"
        hostnames:
          - "romm.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        type: configMap
        name: *app
        globalMounts:
          - path: /romm/config/config.yml
            subPath: config.yml
            readOnly: true
      data:
        existingClaim: *app
        advancedMounts:
          romm:
            app:
              - path: /etc/nginx/conf.d
                subPath: nginx-conf
              - path: /romm/config
                subPath: config
              - path: /romm/resources
                subPath: resources
              - path: /romm/assets
                subPath: assets
      tmp:
        type: emptyDir
      games:
        globalMounts:
          - path: /romm/library
            subPath: romm
        path: /games
        server: ${QNAP_HOSTNAME}
        type: nfs
    configMaps:
      config:
        data:
          config.yml: |-
            exclude:
              platforms: []
              roms:
                single_file:
                  extensions:
                    - "xml"
                    - "txt"
                  names:
                    - "info.txt"
                    - "metadata.txt"
                    - "systeminfo.txt"
                    - "psy.ggjud.iso"
                    - "psy.ggjud.nfo"
                multi_file:
                  names:
                    - "roms"
                    - "pfx"
                    - "mlc01"
                    - ".Trash*"
                  parts:
                    names: []
                    extensions: []
            system:
              platforms:
                3do: "3do" # 3DO Interactive Multiplayer
                n3ds: "3ds" # Nintendo 3DS
                amstradcpc: "acpc" # Amstrad CPC
                amiga: "amiga" # Amiga
                amigacd32: "amiga-cd32" # Amiga CD32
                android: "android" # Android
                apple2gs: "apple2gs" # Apple IIGD
                apple2: "appleii" # Apple II
                arcade: "arcade" # Arcade
                arcadia: "arcadia-2001" # Arcadia 2001
                arduboy: "arduboy" # Arduboy
                astrocde: "astrocade" # Bally Astrocade
                apfm1000: "apf" # APF-M1000/Imagination Machine
                atarijaguarcd: "atari-jaguar-cd" # Atari Jaguar CD
                atarist: "atari-st" # Atari ST/STE
                atari2600: "atari2600" # Atari 2600
                atari5200: "atari5200" # Atari 5200
                atari7800: "atari7800" # Atari 7800
                atari800: "atari8bit" # Atari 8-bit
                c16: "c16" # Commodore 16
                c64: "c64" # Commodore C64/128/MAX
                pv1000: "casio-pv-1000" # Casio PV-1000
                colecovision: "colecovision" # ColecoVision
                cdtv: "commodore-cdtv" # CDTV
                crvision: "creativision" # CreatiVision
                dreamcast: "dc" # Dreamcast
                dos: "dos" # DOS
                dragon32: "dragon-32-slash-64" # Dragon 32/64
                channelf: "fairchild-channel-f" # Channel F
                famicom: "famicom" # Family Computer
                fds: "fds" # Family Computer Disk System
                fmtowns: "fm-towns" # FM Towns
                gameandwatch: "g-and-w" # Game & Watch
                gamecom: "game-dot-com" # Game.Com
                gb: "gb" # Game Boy
                gba: "gba" # Game Boy Advance
                gbc: "gbc" # Game Boy Color
                megadrive: "genesis-slash-megadrive" # Genesis/Mega Drive
                lcdgames: "handheld-electronic-lcd" # Handheld Electronic LCD
                intellivision: "intellivision" # Intellivision
                j2me: "j2me" # J2ME
                atarijaguar: "jaguar" # Atari Jaguar
                atarilynx: "lynx" # Atari Lynx
                macintosh: "mac" # Mac
                megaduck: "mega-duck-slash-cougar-boy" # Mega Duck/Cougar Boy
                msx: "msx" # MSX
                msx2: "msx2" # MSX2
                n64: "n64" # Nintendo 64
                naomi: "naomi" # Naomi
                naomi2: "naomi2" # Naomi2
                naomigd: "naomigd" # Naomi GD
                nds: "nds" # Nintendo DS
                neogeocd: "neo-geo-cd" # Neo Geo CD
                ngp: "neo-geo-pocket" # Neo Geo Pocket
                ngpc: "neo-geo-pocket-color" # Neo Geo Pocket Color
                neogeo: "neogeoaes" # Neo Geo
