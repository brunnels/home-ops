    # Pin the shared moonlight-proxy LoadBalancer VIP. This is so the whole
    # direwolf group stays on a stable address instead of drifting across the
    # pool on recreation.
    service:
      app:
        annotations:
          io.cilium/lb-ipam-ips: ${SVC_DIREWOLF_ADDR}
          io.cilium/lb-ipam-sharing-key: "{{ .Release.Namespace }}"
