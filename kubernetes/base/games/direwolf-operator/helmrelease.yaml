---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app direwolf-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  upgrade:
    crds: CreateReplace
    force: true
  values:
    service:
      app:
        controller: moonlight_proxy
        type: LoadBalancer
        annotations:
          io.cilium/lb-ipam-sharing-key: "{{ .Release.Namespace }}"
          metallb.universe.tf/allow-shared-ip: "{{ .Release.Namespace }}"
