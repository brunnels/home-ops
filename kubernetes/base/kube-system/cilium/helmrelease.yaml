---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cilium
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    bandwidthManager:
      bbr: true
      enabled: true
    bgpControlPlane:
      enabled: true
    bpf:
      datapathMode: netkit
      lbModeAnnotation: true
      masquerade: true
      preallocateMaps: true
      mapSizeFlows: 65536
    bpfClockProbe: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
    dashboards:
      enabled: true
    devices: ${L2_NET_DEVICE}
    enableIPv4BIGTCP: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      metrics:
        enabled:
          - "dns:query;labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|dns|reserved-identity"
          - "drop:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|dns|reserved-identity"
          - "flow:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|dns|reserved-identity"
          - "icmp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|dns|reserved-identity"
          - "tcp:labelsContext=source_namespace,destination_namespace;sourceContext=workload-name|pod|reserved-identity;destinationContext=workload-name|pod|dns|reserved-identity"
          - port-distribution
          - "httpV2:labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      relay:
        enabled: true
        rollOutPods: true
        prometheus:
          enabled: true
          serviceMonitor:
            enabled: true
            trustCRDsExist: true
      ui:
        enabled: true
        rollOutPods: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "${CLUSTER_CIDR}"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      algorithm: maglev
      mode: dsr
      dsrDispatch: opt
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true
    pmtuDiscovery:
      enabled: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
    socketLB:
      enabled: true
      hostNamespaceOnly: true
