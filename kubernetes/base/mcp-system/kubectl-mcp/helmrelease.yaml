---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kubectl-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      kubectl-mcp:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/rohitg00/kubectl-mcp-server
              tag: 1.24.0@sha256:17134e36a3e1d3a5e457c12d61e8c7f7c52a7927c6ae4250131dfd95a74a2331
            args: ["--transport=streamable-http"]
            env:
              MCP_DEBUG: true
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 768Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    rawResources:
      mcp-route:
        forceRename: *app
        manifest:
          apiVersion: aigateway.envoyproxy.io/v1beta1
          kind: MCPRoute
          spec:
            backendRefs:
              - name: *app
                kind: Service
                port: &port 8000
                path: /mcp
                #toolSelector:
                #  include:
                #    - kubectl_get_pods
                #    - kubectl_get_nodes
                #    - kubectl_get_nodes_summary
                #    - kubectl_get_events
                #    - kubectl_get_deployments
                #    - kubectl_get_statefulsets
                #    - kubectl_get_services
                #    - kubectl_get_namespaces
                #    - kubectl_get_pvcs
                #    - kubectl_get_persistent_volumes
                #    - kubectl_get_logs
                #    - kubectl_get_pod_events
                #    - kubectl_describe
                #    - kubectl_health_check
                #    - kubectl_check_pod_health
                #    - kubectl_get_cluster_info
                #    - kubectl_gitops_apps_list_tool
                #    - kubectl_get_node_metrics
                #    - kubectl_get_pod_metrics
            parentRefs:
              - name: envoy-mcp-gateway
                kind: Gateway
                group: gateway.networking.k8s.io
            path: /mcp
    rbac:
      bindings:
        kubectl-mcp-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: kubectl-mcp-read-all
          subjects:
            - identifier: kubectl-mcp
              serviceAccount: kubectl-mcp
        kubectl-mcp-write-restricted:
          type: RoleBinding
          roleRef:
            identifier: kubectl-mcp-write-restricted
          subjects:
            - identifier: kubectl-mcp
              serviceAccount: kubectl-mcp
      roles:
        kubectl-mcp-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources:
                [
                  "pods",
                  "nodes",
                  "services",
                  "namespaces",
                  "configmaps",
                  "persistentvolumes",
                  "persistentvolumeclaims",
                  "endpoints",
                  "resourcequotas",
                  "limitranges",
                  "serviceaccounts",
                  "events",
                ]
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["componentstatuses"]
              verbs: ["get", "list"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list"]
            - apiGroups: ["apps"]
              resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources: ["jobs", "cronjobs"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "networkpolicies"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["gateway.networking.k8s.io"]
              resources: ["gateways", "httproutes", "grpcroutes", "tcproutes", "tlsroutes", "referencegrants"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["external-secrets.io"]
              resources: ["externalsecrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["postgresql.cnpg.io"]
              resources: ["clusters", "backups", "scheduledbackups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["barmancloud.cnpg.io"]
              resources: ["objectstores"]
              verbs: ["get", "list", "watch"]
            # Added 2026-08-09. Each of these blocked a verification
            # during the repo-wide audit, forcing findings to be reasoned
            # about from YAML instead of confirmed against live state —
            # which is exactly how this cluster's three silent-drop
            # incidents went unnoticed in the first place. All read-only.
            #
            # cilium.io: resolve a CNP endpointSelector against real
            # endpoints. A selector matching zero pods is a silent drop
            # with nothing in any log; it cannot be caught by reading
            # the manifest.
            - apiGroups: ["cilium.io"]
              resources:
                [
                  "ciliumnetworkpolicies",
                  "ciliumclusterwidenetworkpolicies",
                  "ciliumendpoints",
                  "ciliumidentities",
                  "ciliumnodes",
                ]
              verbs: ["get", "list", "watch"]
            # ceph.rook.io: read CephCluster health. Needed to confirm
            # the rook-ceph-cluster health gate; had to be inferred by
            # rendering the chart instead.
            - apiGroups: ["ceph.rook.io"]
              resources: ["cephclusters", "cephblockpools", "cephfilesystems", "cephobjectstores"]
              verbs: ["get", "list", "watch"]
            # longhorn.io: recurring-job coverage lives on the Volume CR,
            # NOT the PV — the PV's labels never propagate. Without this
            # there is no way to tell a backed-up volume from an
            # unprotected one.
            - apiGroups: ["longhorn.io"]
              resources: ["volumes", "backups", "snapshots", "recurringjobs", "nodes"]
              verbs: ["get", "list", "watch"]
            # monitoring.coreos.com: confirm a ServiceMonitor/Probe
            # actually selects something, and that a PrometheusRule is
            # loaded rather than merely present in Git.
            - apiGroups: ["monitoring.coreos.com"]
              resources:
                ["servicemonitors", "podmonitors", "probes", "prometheusrules", "scrapeconfigs", "alertmanagerconfigs"]
              verbs: ["get", "list", "watch"]
            # source.toolkit.fluxcd.io: the other half of Flux state —
            # kustomizations/helmreleases above are useless for
            # diagnosing a stalled source without these.
            - apiGroups: ["source.toolkit.fluxcd.io"]
              resources: ["ocirepositories", "gitrepositories", "helmrepositories", "helmcharts", "buckets"]
              verbs: ["get", "list", "watch"]
            # admissionregistration.k8s.io: a failurePolicy:Fail webhook
            # gates every apply in the cluster (#13292). Reading the
            # configs is how you find out which one.
            - apiGroups: ["admissionregistration.k8s.io"]
              resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
              verbs: ["get", "list", "watch"]
        kubectl-mcp-write-restricted:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["delete"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["delete"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["patch", "update"]
    service:
      app:
        ports:
          http:
            port: *port
    serviceAccount:
      kubectl-mcp: {}
