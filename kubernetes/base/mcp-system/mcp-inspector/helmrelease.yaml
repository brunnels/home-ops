---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mcp-inspector
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      app:
        containers:
          app:
            image:
              repository: ghcr.io/modelcontextprotocol/inspector
              tag: 2.15.0@sha256:a907a7d15d59aebd06050d5bebed9227c6fb66fd8d9511be252e13d27b2d643d
            args:
              - --transport
              - http
              - http://vmcp-mcp-gateway-internal.mcp-system:4483/mcp
            env:
              MCP_APP_ORIGIN_FULL_ADDRESS: mcp-inspector.${SECRET_DOMAIN}
              DANGEROUSLY_OMIT_AUTH: "true"
              ALLOWED_ORIGINS: https://mcp-inspector.${SECRET_DOMAIN},http://vmcp-mcp-gateway-internal.mcp-system:4483
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    route:
      app:
        hostnames:
          - mcp-inspector.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: 6274
