---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name arista-eos-mcp
spec:
  dataFrom:
    - extract:
        key: arista
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        EOS_HOST: "{{ .EAPI_HOST }}"
        EOS_USERNAME: "{{ .EAPI_USERNAME }}"
        EOS_PASSWORD: "{{ .EAPI_PASSWORD }}"
