---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr
spec:
  args:
    - -y
    - "mcp-arr-server@1.5.4"
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SONARR_URL
      value: http://sonarr.downloads
    - name: RADARR_URL
      value: http://radarr.downloads
    - name: LIDARR_URL
      value: http://lidarr.downloads
    - name: PROWLARR_URL
      value: http://prowlarr.downloads
  groupRef:
    name: mcp-tools
  image: docker.io/node:26-alpine@sha256:8996bb5821d62a8fd9bb27c1cb07462f3fdce6e47d640c6a881ead0b064ce216
  podTemplateSpec:
    spec:
      containers:
        - command:
            - npx
          name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
      volumes:
        - emptyDir: {}
          name: tmp
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  secrets:
    - key: SONARR_API_KEY
      name: &secret arr-mcp
      targetEnvName: SONARR_API_KEY
    - key: RADARR_API_KEY
      name: *secret
      targetEnvName: RADARR_API_KEY
    - key: LIDARR_API_KEY
      name: *secret
      targetEnvName: LIDARR_API_KEY
    - key: PROWLARR_API_KEY
      name: *secret
      targetEnvName: PROWLARR_API_KEY
  transport: stdio
