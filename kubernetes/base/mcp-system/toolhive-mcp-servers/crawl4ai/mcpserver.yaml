apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: crawl4ai
spec:
  image: unclecode/crawl4ai:latest
  mcpPort: 11235
  proxyPort: 8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsNonRoot: true
  resources:
    limits:
      cpu: 1000m
      memory: 2Gi
    requests:
      cpu: 25m
      memory: 384Mi
  transport: streamable-http
