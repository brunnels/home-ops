---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
spec:
  env:
    - name: GITHUB_READ_ONLY
      value: "0"
  groupRef:
    name: mcp-tools
  image: ghcr.io/github/github-mcp-server:v2.3.0@sha256:f8ee4dedc7d5c8cb32854ab91cc92a31c55a8a5510708cf8742e9f9427588ca6
  proxyPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  secrets:
    - key: GITHUB_MCP_TOKEN
      name: github-mcp
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  transport: stdio
