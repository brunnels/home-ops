---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: github
spec:
  env:
    - name: GITHUB_READ_ONLY
      value: "0"
  groupRef:
    name: mcp-tools
  image: ghcr.io/github/github-mcp-server:v2.1.0@sha256:f6056fc10bfffcc8c81a6417a2e9ca12808647e8dd6049642a4feaadee0e0f8a
  proxyPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  secrets:
    - key: GITHUB_MCP_TOKEN
      name: github-mcp
      targetEnvName: GITHUB_PERSONAL_ACCESS_TOKEN
  transport: stdio
