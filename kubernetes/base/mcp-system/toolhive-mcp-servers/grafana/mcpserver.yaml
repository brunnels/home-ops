---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  args:
    - --transport
    - streamable-http
    - --allowed-hosts
    - "*"
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability:3000
    - name: GRAFANA_USAGE_STATS
      value: disabled
  groupRef:
    name: mcp-tools
  image: grafana/mcp-grafana:2.3.0@sha256:c27248b5919d09d64ea273ca1b128b32902c6796f6e2dfcd11849d4f1363f9ed
  mcpPort: 8000
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 0
  proxyPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  secrets:
    - key: GRAFANA_PASSWORD
      name: &secret grafana-mcp
      targetEnvName: GRAFANA_PASSWORD
    - key: GRAFANA_USERNAME
      name: *secret
      targetEnvName: GRAFANA_USERNAME
  transport: streamable-http
