---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &app kubectl-mcp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/rohitg00/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  mcpPort: 8000
  podTemplateSpec:
    spec:
      containers:
        - env:
            - name: MCP_SERVER_TRANSPORT
              value: streamable-http
            - name: MCP_SERVER_HOST
              value: 0.0.0.0
            - name: MCP_SERVER_PORT
              value: "8000"
            - name: MCP_ALLOW_UNAUTHENTICATED
              value: "true"
            # Read-only safety mode blocks every state-changing tool server-side
            # (2.0 finally enforces this). Toolsets restore our surface: default
            # (core+helm) = generic kubectl verbs + diagnose_pod_crash; diagnostics =
            # check_pod_health/get_nodes_summary; security = analyze_network_policies;
            # gitops = the Flux/Argo readers.
            - name: MCP_SAFETY_MODE
              value: read-only
            - name: MCP_TOOLSETS
              value: "default,diagnostics,security,gitops"
            - name: MCP_MASK_SECRETS
              value: "true"
            # Gateway forwards a non-loopback Host/Origin; 2.0 defaults these to
            # loopback-only and would 400. Narrow once the forwarded Host is confirmed.
            - name: MCP_ALLOWED_HOSTS
              value: "*"
            - name: MCP_ALLOWED_ORIGINS
              value: "*"
            - name: PYTHONUNBUFFERED
              value: "1"
            #- name: MCP_K8S_PROVIDER
            #  value: in-cluster
          name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs
              subPath: tmp
            - mountPath: /home/mcp
              name: tmpfs
              subPath: home
            - mountPath: /home/mcp/.cache
              name: tmpfs
              subPath: cache
            - mountPath: /home/mcp/.config
              name: tmpfs
              subPath: config
            - mountPath: /home/mcp/.kube
              name: tmpfs
              subPath: kube
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 50m
      memory: 114Mi
  serviceAccount: *app
  toolConfigRef:
    name: *app
  transport: streamable-http
