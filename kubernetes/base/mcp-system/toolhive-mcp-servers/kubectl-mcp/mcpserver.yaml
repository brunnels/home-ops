---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &app kubectl-mcp
spec:
  args:
    - --transport
    - streamable-http
    - --host
    - 0.0.0.0
    - --port
    - "8000"
    - --read-only
  groupRef:
    name: mcp-tools
  image: ghcr.io/rohitg00/kubectl-mcp-server:1.24.0@sha256:17134e36a3e1d3a5e457c12d61e8c7f7c52a7927c6ae4250131dfd95a74a2331
  mcpPort: 8000
  podTemplateSpec:
    spec:
      containers:
        - env:
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
          name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - mountPath: /tmp
              name: tmpfs
      securityContext:
        runAsGroup: 0
        runAsNonRoot: true
        runAsUser: 0
      volumes:
        - name: tmpfs
          emptyDir:
            medium: Memory
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceAccount: *app
  toolConfigRef:
    name: *app
  transport: streamable-http
