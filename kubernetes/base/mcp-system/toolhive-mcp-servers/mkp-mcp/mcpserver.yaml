---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &app mkp-mcp
spec:
  name: k8s
  transport:
    http:
      url: http://cluster.local
  deployment:
    podTemplate:
      spec:
        serviceAccountName: *app
        containers:
          - name: server
            image: ghcr.io/stackloklabs/mkp/server:0.4.5@sha256:13dc7703d2a1a241feb685faafa4b04353d9efc6c33cd816196523987e9a0e25
            ports:
              - containerPort: 8080
                name: http
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
            env:
              - name: LOG_LEVEL
                value: "info"
