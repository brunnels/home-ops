---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &app mkp
spec:
  groupRef:
    name: mcp-tools
  image: ghcr.io/stackloklabs/mkp/server:0.5.1@sha256:cec718d6831668ebcf871248a95acbe45e90e54093a5eb1036023ba97d7d9cbb
  mcpPort: 8080
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      securityContext:
        runAsNonRoot: true
  proxyPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  serviceAccount: mkp-mcp
  transport: streamable-http
