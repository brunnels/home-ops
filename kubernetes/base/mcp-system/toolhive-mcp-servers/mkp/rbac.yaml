---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mkp-mcp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mkp-mcp
rules:
  # Cluster discovery and scoping rules needed for multi-namespace listings
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  # Core resources across all namespaces
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "persistentvolumeclaims", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Workload resources across all namespaces
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Networking resources across all namespaces
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mkp-mcp
subjects:
  - kind: ServiceAccount
    name: mkp-mcp
    namespace: toolhive
roleRef:
  kind: ClusterRole
  name: mkp-mcp
  apiGroup: rbac.authorization.k8s.io
