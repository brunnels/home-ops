---
# yaml-language-server: $schema=https://crd.movishell.pl/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: prometheus
spec:
  image: ghcr.io/pab1it0/prometheus-mcp-server:1.6.2@sha256:3c3921301229618d0b00a46a06e3b0c25745b31855f16919cf7b4fa040d47ec6
  env:
    - name: PROMETHEUS_URL
      value: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
    - name: PROMETHEUS_DISABLE_LINKS
      value: "true"
    - name: PROMETHEUS_MCP_SERVER_TRANSPORT
      value: http
    - name: PROMETHEUS_MCP_BIND_HOST
      value: 0.0.0.0
    - name: PROMETHEUS_MCP_STATELESS_HTTP
      value: "true"
  groupRef:
    name: mcp-tools
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  transport: streamable-http
