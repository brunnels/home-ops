---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: seerr-mcp
spec:
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SEERR_URL
      value: http://seerr.media
  groupRef:
    name: mcp-tools
  image: docker.io/node:24-alpine
  podTemplateSpec:
    spec:
      containers:
        - args:
            - -y
            - "@jhomen368/overseerr-mcp"
          command:
            - npx
          image: docker.io/node:24-alpine
          name: mcp
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - emptyDir: {}
          name: tmp
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  secrets:
    - key: SEERR_API_KEY
      name: toolhive-seerr
      targetEnvName: SEERR_API_KEY
  transport: stdio
