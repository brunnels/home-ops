---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: seerr
spec:
  args:
    - -y
    - "@jhomen368/overseerr-mcp"
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SEERR_URL
      value: http://seerr.media
  groupRef:
    name: mcp-tools
  image: docker.io/node:26-alpine@sha256:6bd9ab43c0ec0190ca7b2d193906cb8b7edf6e7f4afa43ddeccd6452710bffb5
  podTemplateSpec:
    spec:
      containers:
        - command:
            - npx
          name: mcp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsNonRoot: true
      volumes:
        - emptyDir: {}
          name: tmp
  proxyMode: streamable-http
  proxyPort: 8080
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  secrets:
    - key: SEERR_API_KEY
      name: seerr-mcp
      targetEnvName: SEERR_API_KEY
  transport: stdio
