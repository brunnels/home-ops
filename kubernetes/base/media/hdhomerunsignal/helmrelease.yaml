---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hdhomerunsignal
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      hdhomerunsignal:
        containers:
          app:
            image:
              repository: petelombardo/hdhomerun-signal-web
              tag: latest@sha256:b2079734203a0e55c7f364114ce73dac997ad9cea01fe6026fe53a9c5bf113bf
            env:
              HDHOMERUN_DEVICES: hdhr.${INTERNAL_DOMAIN}
              HDHOMERUN_DISABLE_DISCOVERY: "true"
    route:
      app:
        hostnames:
          - hdhomerun.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: &port 3000
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
