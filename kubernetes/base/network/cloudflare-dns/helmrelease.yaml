---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-dns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  interval: 1h
  values:
    domainFilters:
      - "${SECRET_DOMAIN}"
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            key: CF_API_TOKEN
            name: cloudflare-dns
      - name: CF_ZONE_ID
        valueFrom:
          secretKeyRef:
            key: CF_ZONE_ID
            name: cloudflare-dns
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
      - --zone-id-filter=$(CF_ZONE_ID)
    fullnameOverride: cloudflare-dns
    logLevel: info
    podAnnotations:
      secret.reloader.stakater.com/reload: cloudflare-dns
    policy: sync
    provider: cloudflare
    serviceMonitor:
      enabled: true
    sources:
      - crd
      - gateway-httproute
    triggerLoopOnEvent: true
    txtOwnerId: default
    txtPrefix: k8s.
