---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: inject-nord-theme-global
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  lua:
    - type: Inline
      inline: |
        function envoy_on_request(request_handle)
          request_handle:logInfo("Lua script processing response for path: " .. request_handle:headers():get(":authority"))
          local app = request_handle:headers():get("x-theme-park-app")
          if app then
            request_handle:logInfo("Found x-theme-park-app header: " .. app)
          end
        end
        function envoy_on_response(request_handle)
          request_handle:logInfo("Lua script processing response")
        end
