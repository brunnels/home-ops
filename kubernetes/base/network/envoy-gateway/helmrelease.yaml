---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    config:
      envoyGateway:
        extensionApis:
          enableEnvoyPatchPolicy: true
          enableLua: true
        provider:
          kubernetes:
            deploy:
              type: GatewayNamespace
          type: Kubernetes
    deployment:
      envoyGateway:
        resources:
          limits:
            memory: 1024Mi
          requests:
            cpu: 100m
            memory: 768Mi
    global:
      imageRegistry: mirror.gcr.io
