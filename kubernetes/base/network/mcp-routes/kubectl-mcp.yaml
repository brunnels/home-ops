# MCPRoute not working due to ai-gateway bug: https://github.com/envoyproxy/ai-gateway/issues/1915
# The ai-gateway controller fails to properly resolve FQDN endpoints in Backend resources.
# Using manual HTTPRoutes as workaround instead.
#
# Keeping the MCPRoute and useless httproutes it creates because there's no other way to use toolSelectors
apiVersion: aigateway.envoyproxy.io/v1beta1
kind: MCPRoute
metadata:
  name: &name kubectl-mcp-test
  namespace: network
spec:
  backendRefs:
    # waiting on https://github.com/envoyproxy/ai-gateway/issues/2385 to support RefrenceGrants
    # for now use Backend as workaround
    #- group: ""
    #  kind: Service
    #  name: *name
    #  namespace: mcp-system
    #  path: /mcp
    #  port: 8000
    - group: gateway.envoyproxy.io
      kind: Backend
      name: *name
      path: /mcp
      toolSelector:
        includeRegex:
          - exec_in_pod
          - cleanup_pods
          - detect_pending_pods
          - get_current_context
          - health_check
          - kubectl_explain
          - node_logs_tool
          - node_stats_summary_tool
          - node_top_tool
          - audit_rbac_permissions
          - port_forward
          - kubectl_describe
          - hubble_flows_query_tool
          - cilium_.*
          - keda_.*
          - policy_.*
          - get_.*
          - check_.*
          - analyze_.*
          - trace_.*
          - diagnose_.*
          - list_.*
  parentRefs:
    - name: envoy-ai
      kind: Gateway
      group: gateway.networking.k8s.io
  path: /mcp
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: kubectl-mcp
spec:
  endpoints:
    - fqdn:
        hostname: kubectl-mcp.mcp-system.svc.cluster.local
        port: 8000
---
# Manual HTTPRoute workaround for MCPRoute due to ai-gateway bug #1915
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-mcp-main
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: kubectl-mcp
          port: 8000
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-ai-eg-mcp-route
                value: network/kubectl-mcp
      timeouts:
        request: 30m
        backendRequest: 30m
---
# HTTPRoute for backend references (for ai-gateway extproc routing)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-mcp-backend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: kubectl-mcp
          port: 8000
      timeouts:
        request: 30m
        backendRequest: 30m
