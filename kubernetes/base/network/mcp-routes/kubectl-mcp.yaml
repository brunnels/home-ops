        hostname: kubectl-mcp.mcp-system.svc.cluster.local
        port: 8000
---
# Manual HTTPRoute workaround for MCPRoute due to ai-gateway bug #1915
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-mcp-main
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: kubectl-mcp
          port: 8000
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-ai-eg-mcp-route
                value: network/kubectl-mcp
      timeouts:
        request: 30m
        backendRequest: 30m
---
# HTTPRoute for backend references (for ai-gateway extproc routing)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubectl-mcp-backend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: kubectl-mcp
          port: 8000
      timeouts:
        request: 30m
        backendRequest: 30m
