---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gatus-sidecar
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    config:
      existingConfigMap: *app
      items:
        - key: config.yaml
          path: config.yaml
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    gatus:
      delayStartSeconds: "5"
      env:
        TZ: "${TIMEZONE}"
      envFrom:
        - secretRef:
            name: *app
    httpRoute:
      annotations:
        gatus.home-operations.com/enabled: "false"
        gethomepage.dev/description: Status Page
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: Observability
        gethomepage.dev/icon: *app
        gethomepage.dev/name: Gatus
        gethomepage.dev/widget.type: *app
        gethomepage.dev/widget.url: "http://gatus.{{ .Release.Namespace }}"
      enabled: true
      hostnames:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        - "status.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-external
          namespace: network
    monitoring:
      serviceMonitor:
        enabled: true
    persistence:
      accessMode: ReadWriteOnce
      enabled: true
      size: 5Gi
      storageClass: ceph-block
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 100m
    sidecar:
      kinds:
        httproute:
          auto: true
          enable: true
        service:
          enable: true
