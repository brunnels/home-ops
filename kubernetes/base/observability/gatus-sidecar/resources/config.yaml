---
alerting:
  pushover:
    application-token: $${GATUS_PUSHOVER_TOKEN}
    default-alert:
      description: health-check failed
      failure-threshold: 5
      send-on-resolved: true
      success-threshold: 3
    priority: 1
    resolved-priority: 0
    sound: gamelan
    title: "Gatus (${VAULT_PREFIX})"
    user-key: $${PUSHOVER_USER_KEY}
connectivity:
  checker:
    interval: 1m
    target: 1.1.1.1:53
endpoints:
  #- name: nas-cert-expiration
  #  group: domain
  #  url: "https://${QNAP_HOSTNAME}"
  #  interval: 1h
  #  conditions:
  #    - "[CERTIFICATE_EXPIRATION] > 240h"

  #- name: cert-expiration
  #  group: domain
  #  url: "https://status.${SECRET_DOMAIN}"
  #  interval: 1h
  #  conditions:
  #    - "[CERTIFICATE_EXPIRATION] > 240h"

  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
metrics: true
storage:
  caching: true
  path: $${GATUS_CONFIG_PATH}/gatus.db
  type: sqlite
ui:
  buttons:
    - name: Github
      link: https://github.com/brunnels
    - name: Homelab
      link: https://github.com/brunnels/home-ops
  default-sort-by: group
  header: Status
  link: https://github.com/brunnels
  logo: https://avatars.githubusercontent.com/u/560075
  title: Status | Gatus
web:
  port: $${GATUS_WEB_PORT}
