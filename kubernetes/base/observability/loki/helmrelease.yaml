---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app loki
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: storage
  interval: 1h
  values:
    backend:
      replicas: 0
    chunksCache:
      enabled: false
    deploymentMode: SingleBinary
    gateway:
      replicas: 0
    loki:
      analytics:
        reporting_enabled: false
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      compactor:
        delete_request_store: filesystem
        retention_enabled: true
        working_directory: /var/loki/compactor/retention
      ingester:
        chunk_encoding: snappy
      limits_config:
        retention_period: 14d
      schemaConfig:
        configs:
          - from: "2024-04-01" # quote
            index:
              period: 24h
              prefix: loki_index_
            object_store: filesystem
            schema: v13
            store: tsdb
      server:
        grpc_server_max_recv_msg_size: 10485760 # 10 MiB
        grpc_server_max_send_msg_size: 10485760 # 10 MiB
        log_level: info
      storage:
        bucketNames:
          # Workaround for https://github.com/grafana/loki/issues/19655
          chunks: fnord
        type: filesystem
    lokiCanary:
      enabled: false
    memberlist:
      service:
        publishNotReadyAddresses: true
    read:
      replicas: 0
    resultsCache:
      enabled: false
    sidecar:
      enableUniqueFilenames: true
      image:
        repository: ghcr.io/home-operations/k8s-sidecar
        tag: 2.10.1@sha256:9d9338eba4dbf0ae8151e772ef96d3806d56115acf5521d615e31694e046fe47
      rules:
        folder: /rules/fake
        searchNamespace: ALL
    singleBinary:
      persistence:
        enabled: true
        size: 50Gi
        storageClass: ceph-block
      replicas: 1
    test:
      enabled: false
    write:
      replicas: 0
