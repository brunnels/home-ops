---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homebox-companion
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      homebox-companion:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/duelion/homebox-companion
              tag: 3.0.2@sha256:3c381c647f9ec776e1b6d7d49164591c78ef1af5a29a6cae343542ffcffd15c4
            env:
              TZ: "${TIMEZONE}"
              HBC_HOMEBOX_URL: http://homebox:8080
              HBC_LINK_BASE_URL: https://homebox.${SECRET_DOMAIN}
              HBC_LLM_MODEL: hosted_vllm/Qwen/Qwen2.5-VL-3B-Instruct
              HBC_LLM_API_KEY: "insecure"
              HBC_LLM_API_BASE: http://vllm-stack-router-service/v1
              HBC_LLM_ALLOW_UNSAFE_MODELS: true
              HBC_SERVER_HOST: 0.0.0.0
              HBC_SERVER_PORT: &port 8000
              HBC_LOG_LEVEL: INFO
              HBC_DISABLE_UPDATE_CHECK: true
              HBC_IMAGE_QUALITY: medium
            #envFrom:
            #  - secretRef:
            #      name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/description: AI Inventory Assistant
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Automation
          gethomepage.dev/icon: mdi-package-variant-closed-plus
          gethomepage.dev/name: Homebox Companion
        hostnames:
          - "homebox-companion.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /home/appuser/.cache
