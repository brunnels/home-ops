---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authelia-oidc-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 1h
  upgrade:
    crds: CreateReplace
    force: true
  values:
    controllers:
      controller_manager:
        containers:
          manager:
            image:
              repository: ghcr.io/brunnels/authelia-oidc-operator
              #tag: pr-1@sha256:1ba694127c438c9a9df0f400d2a89e14891781dbb17441830fb1c5b2044c7143
