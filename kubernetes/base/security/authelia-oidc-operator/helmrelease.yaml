---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authelia-oidc-operator
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  interval: 1h
  upgrade:
    crds: CreateReplace
    force: true
  values: []
