---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authelia
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      authelia:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          topologySpreadConstraints:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: *app
              maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
        replicas: 2
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/authelia/authelia
              tag: 4.39.28
            env:
              AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /app/secrets/AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD
              AUTHELIA_CERTIFICATES_DIRECTORY: /trusted_certs
              AUTHELIA_DUO_API_INTEGRATION_KEY_FILE: /app/secrets/AUTHELIA_DUO_API_INTEGRATION_KEY
              AUTHELIA_DUO_API_SECRET_KEY_FILE: /app/secrets/AUTHELIA_DUO_API_SECRET_KEY
              AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /app/secrets/AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET
              AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE: /app/secrets/AUTHELIA_NOTIFIER_SMTP_PASSWORD
              AUTHELIA_SERVER_ADDRESS: tcp://0.0.0.0:80
              AUTHELIA_SERVER_DISABLE_HEALTHCHECK: "true"
              AUTHELIA_SESSION_SECRET_FILE: /app/secrets/AUTHELIA_SESSION_SECRET
              AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /app/secrets/AUTHELIA_STORAGE_ENCRYPTION_KEY
              AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /app/secrets/AUTHELIA_STORAGE_POSTGRES_PASSWORD
              AUTHELIA_TELEMETRY_METRICS_ADDRESS: tcp://0.0.0.0:8080
              AUTHELIA_TELEMETRY_METRICS_ENABLED: "true"
              AUTHELIA_THEME: dark
              TZ: "${TIMEZONE}"
              X_AUTHELIA_CONFIG: /config/configuration.yaml,/config/authelia.oidc.yaml
              X_AUTHELIA_CONFIG_FILTERS: template

            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  httpGet:
                    path: /api/health
                    port: &port 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 52Mi
              limits:
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ "ALL" ] }
              readOnlyRootFilesystem: true
          anubis:
            image:
              repository: ghcr.io/techarohq/anubis
              tag: v1.28.1@sha256:1744c03a918160a28b0d2e8c1656de6585f4071b30b4c3b0d51d02282c9b7c25
            env:
              ED25519_PRIVATE_KEY_HEX:
                valueFrom:
                  secretKeyRef:
                    name: authelia-anubis
                    key: ANUBIUS_PRIVATE_KEY_HEX
              TZ: "${TIMEZONE}"
              BIND: ":8923"
              DIFFICULTY: "4"
              SERVE_ROBOTS_TXT: "true"
              TARGET: "http://localhost:80"
            ports:
              - name: *app
                containerPort: *port
              - name: metrics
                containerPort: &metricsPort 8080
              - name: anubis
                containerPort: &anubisPort 8923
            resources:
              limits:
                memory: 256Mi
              requests:
                cpu: 26m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ "ALL" ] }
    persistence:
      config:
        type: configMap
        name: *app
        advancedMounts:
          authelia:
            app:
              - path: /config/configuration.yaml
                readOnly: true
                subPath: configuration.yaml

      oidc-config:
        type: secret
        name: default-oidc
        advancedMounts:
          authelia:
            app:
              - path: /config/authelia.oidc.yaml
                readOnly: true
                subPath: authelia.oidc.yaml

      secret-files:
        type: secret
        name: authelia-files
        advancedMounts:
          authelia:
            app:
              - path: /app/secrets

      trusted-certs:
        type: configMap
        name: letsencrypt-certs
        advancedMounts:
          authelia:
            app:
              - path: /trusted_certs/letsencrypt-certs.pem
                readOnly: true
                subPath: letsencrypt-certs.pem
    route:
      app:
        hostnames:
          - "auth.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: anubis
    service:
      app:
        controller: *app
        ports:
          anubis:
            port: *anubisPort
          http:
            port: *port
          metrics:
            port: *metricsPort
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
        serviceName: *app
