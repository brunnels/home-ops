---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ceph-csi-drivers
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    drivers:
      cephfs:
        enabled: true
        kernelMountOptions:
          ms_mode: prefer-crc
        name: rook-ceph.cephfs.csi.ceph.com
        nodePlugin:
          tolerations: &pluginTolerations
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
        snapshotPolicy: volumeSnapshot
      nfs:
        enabled: false
      nvmeof:
        enabled: false
      rbd:
        enabled: true
        name: storage.rbd.csi.ceph.com
        nodePlugin:
          tolerations: *pluginTolerations
        snapshotPolicy: volumeSnapshot
