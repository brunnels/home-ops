---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 100
        runAsNonRoot: true
        runAsUser: 1000
    controllers:
      garage:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: dxflrs/garage
              tag: v2.4.0@sha256:715d176efc35384bf72cf6052fd61b74b3e27a1e31a9dfedabe646bd1e92f137
            env:
              TZ: ${TIMEZONE}
            probes: &probes
              liveness: &probe
                enabled: true
              readiness: *probe
            resources:
              requests:
                cpu: 5m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              readOnlyRootFilesystem: true
          web-ui:
            image:
              repository: khairul169/garage-webui
              tag: 1.1.0@sha256:17c793551873155065bf9a022dabcde874de808a1f26e648d4b82e168806439c
            env:
              API_BASE_URL: http://garage.{{ .Release.Namespace }}.svc.cluster.local:3903
              S3_ENDPOINT_URL: http://garage.{{ .Release.Namespace }}.svc.cluster.local:3900
              TZ: ${TIMEZONE}
            probes: *probes
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            securityContext: *securityContext
    persistence:
      config:
        type: secret
        name: garage
        globalMounts:
          - path: /etc/garage.toml
            subPath: garage.toml
      data:
        type: nfs
        path: /appdata/${VAULT_PREFIX}-garage
        server: ${QNAP_HOSTNAME}
        advancedMounts:
          garage:
            app:
              - path: /data
                subPath: data
              - path: /meta
                subPath: meta
    route:
      app:
        hostnames:
          - "s3.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: s3
      web-ui:
        annotations:
          gethomepage.dev/description: S3-compatible object store for small self-hosted deployments
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Storage
          gethomepage.dev/icon: garage
          gethomepage.dev/name: Garage
          gethomepage.dev/pod-selector: app.kubernetes.io/name = garage
        hostnames:
          - "garage.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: web-ui
                port: http
      web-ui-public:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "garage.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: Exact
                  value: /site.webmanifest
              - path:
                  type: Exact
                  value: /favicon.ico
            backendRefs:
              - identifier: web-ui
                port: http
    service:
      app:
        annotations: &annotations
          gatus.home-operations.com/endpoint: |
            group: internal
            alerts:
              - type: pushover
        forceRename: garage
        ports:
          api:
            port: 3903
            protocol: HTTP
          s3:
            port: 3900
            primary: true
            protocol: HTTP
      web-ui:
        annotations: *annotations
        ports:
          http:
            port: 3909
            protocol: HTTP
