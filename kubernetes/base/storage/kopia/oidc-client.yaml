---
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: ${APP}
  annotations:
    authelia.milas.dev/oidc-provider: ${APP}/${NAMESPACE}
spec:
  description: ${APP}
  grant_types:
    - authorization_code
    - refresh_token
  preconfigured_consent_duration: 1y
  redirect_uris:
    - https://${APP}.${SECRET_DOMAIN}/oauth2/callback
  response_types:
    - code
  secret_ref:
    name: ${APP}
    fields:
      client_id: OIDC_CLIENT_ID
      client_secret: OIDC_CLIENT_SECRET
  scopes:
    - openid
    - offline_access
