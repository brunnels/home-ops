---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: ${QNAP_HOSTNAME}
          path: /appdata/${VAULT_PREFIX}-kopia
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopia
      namespace: ${NAMESPACE}
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: namespace + '-' + policyName
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    #cache:
    #  capacity: 1Mi
    #  mode: Ephemeral
    #  storageClassName: ${LOCAL_STORAGECLASS:=openebs-hostpath}
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
    #scratch:
    #  capacity: 1Mi
    #  storageClassName: ${LOCAL_STORAGECLASS:=openebs-hostpath}
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
    ttlSecondsAfterFinished: 300
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}
