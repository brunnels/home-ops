---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/clusterrepository_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: nas
spec:
  allowedNamespaces:
    all: true
  backend:
    filesystem:
      path: /repo
      volume:
        nfs:
          server: ${QNAP_HOSTNAME}
          path: /appdata/${VAULT_PREFIX}-kopia
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopia
      namespace: ${NAMESPACE}
      key: KOPIA_PASSWORD
  identityDefaults:
    hostnameExpr: namespace
    usernameExpr: namespace + '-' + policyName
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    #cache:
    #  capacity: 1Mi
    #  mode: Ephemeral
    #  storageClassName: ${LOCAL_STORAGECLASS:=openebs-hostpath}
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
    #scratch:
    #  capacity: 1Mi
    #  storageClassName: ${LOCAL_STORAGECLASS:=openebs-hostpath}
    securityContext:
      runAsUser: 1000
      runAsGroup: 100
    ttlSecondsAfterFinished: 300
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: truenas-s3
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: ${VAULT_PREFIX}-kopiur
      endpoint: ${TRUENAS_HOSTNAME}:9000
      region: us-east
      auth:
        secretRef:
          name: kopiur
  create:
    enabled: true
  encryption:
    passwordSecretRef:
      name: kopiur
      namespace: ${NAMESPACE}
      key: KOPIA_PASSWORD
  maintenance:
    schedule:
      quick:
        cron: 0 * * * *
        jitter: 10m
      full:
        cron: 0 3 * * *
        jitter: 1h
  moverDefaults:
    cache:
      # Every cache PVC is 5Gi or larger (KOPIUR_CAPACITY default). Kopia's own
      # defaults are 5000 MiB per budget, larger than the whole PVC, so the
      # sweeper never runs and the cache fills the volume. The metadata budget
      # applies twice: kopia caps the index-blobs cache at the same size.
      contentCacheSizeMb: 512
      metadataCacheSizeMb: 1024
  parameters:
    epoch:
      minDuration: 1h
  scheduleDefaults:
    timezone: ${TIMEZONE}
