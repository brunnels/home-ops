---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    extraVolumeMounts:
      - mountPath: /repo
        name: repo
    extraVolumes:
      - name: repo
        nfs:
          path: /appdata/${VAULT_PREFIX}-kopia
          server: ${QNAP_HOSTNAME}
    features:
      kopiaUi:
        enabled: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 100
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
    ui:
      enabled: true
      auth:
        allowedGroups:
          - Admins
          - Domain Users
        emailHeader: x-user-email
        groupsFormat: base64Json
        groupsHeader: x-user-groups
        proxySecret:
          existingSecret: kopiur-ui
          key: credential
        userHeader: x-user-username
      rbac:
        userRoles: true
        bindings:
          - groups:
              - Admins
            role: user
          - groups:
              - Domain Users
            role: viewer
      networkPolicy:
        enabled: true
        proxySelector:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/component: proxy
