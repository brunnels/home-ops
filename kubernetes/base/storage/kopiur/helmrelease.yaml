---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 1h
  values:
    extraVolumeMounts:
      - mountPath: /repo
        name: repo
    extraVolumes:
      - name: repo
        nfs:
          path: "/appdata/${VAULT_PREFIX}-kopia"
          server: ${QNAP_HOSTNAME}
    features:
      kopiaUi:
        enabled: true
    monitoring:
      dashboards:
        enabled: false
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podSecurityContext:
      fsGroup: 100
      fsGroupChangePolicy: OnRootMismatch
      runAsGroup: 100
      runAsNonRoot: true
      runAsUser: 1000
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 100m
    ui:
      enabled: true
      auth:
        acknowledgeNoProxySecret: true
        userHeader: x-user-username
        groupsHeader: x-user-groups
        emailHeader: x-user-email
        allowedGroups:
          - Admins
