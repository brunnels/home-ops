---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app truenas-csi
spec:
  chartRef:
    kind: GitRepository
    name: *app
  interval: 1h
  values:
    truenas:
      defaultPool: ${TRUENAS_POOLNAME}
      existingSecret: *app
      url: wss://${TRUENAS_HOSTNAME}
