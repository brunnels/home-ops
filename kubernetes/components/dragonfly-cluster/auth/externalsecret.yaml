---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ${NAMESPACE}-dragonfly
spec:
  dataFrom:
    - extract:
        key: ${VAULT_PREFIX}/${NAMESPACE}-dragonfly
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        password: "{{ .DRAGONFLY_PASSWORD_SECRET }}"
