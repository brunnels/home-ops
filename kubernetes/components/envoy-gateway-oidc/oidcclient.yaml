---
# yaml-language-server: $schema=https://brunnels.github.io/authelia-oidc-operator/authelia.milas.dev/oidcclient_v1alpha2.json
apiVersion: authelia.milas.dev/v1alpha2
kind: OIDCClient
metadata:
  name: ${APP_SUBDOMAIN:-${APP}}
  annotations:
    authelia.milas.dev/oidc-provider: security/default
spec:
  claims:
    policy:
      id_token:
        - email
        - groups
        - name
        - preferred_username
  description: ${OIDC_DESCRIPTION:-${APP}}
  grant_types:
    - authorization_code
    - refresh_token
  preconfigured_consent_duration: 1y
  redirect_uris:
    - https://${APP_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}/oauth2/callback
  response_types:
    - code
  secret_ref:
    name: ${APP_SUBDOMAIN:-${APP}}-oidc
    fields:
      client_id: client-id
      client_secret: client-secret
  scopes:
    - email
    - groups
    - openid
    - profile
