---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP_SUBDOMAIN:-${APP}}-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${OIDC_ROUTE_NAME:-${APP}}
  jwt:
    providers:
      - claimToHeaders:
          - claim: name
            header: x-user-fullname
          - claim: preferred_username
            header: x-user-username
          - claim: email
            header: x-user-email
          - claim: groups
            header: x-user-groups
        extractFrom:
          cookies:
            - &idTokenName IdToken-${APP_SUBDOMAIN:-${APP}}-oidc
        issuer: https://auth.${SECRET_DOMAIN}
        name: authelia
        remoteJWKS:
          uri: https://auth.${SECRET_DOMAIN}/jwks.json
  oidc:
    clientIDRef:
      name: ${APP_SUBDOMAIN:-${APP}}-oidc
    clientSecret:
      name: ${APP_SUBDOMAIN:-${APP}}-oidc
    cookieNames:
      idToken: *idTokenName
    provider:
      issuer: https://auth.${SECRET_DOMAIN}
      authorizationEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
      tokenEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/token
    redirectURL: https://${APP_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}/oauth2/callback
    scopes:
      - email
      - groups
      - openid
      - profile
