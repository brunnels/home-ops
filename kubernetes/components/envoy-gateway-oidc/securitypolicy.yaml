---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP_SUBDOMAIN:-${APP}}-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${OIDC_ROUTE_NAME:-${APP}}
  jwt:
    providers:
      - name: my-oidc-provider
        issuer: https://auth.${SECRET_DOMAIN}
        remoteJWKS:
          uri: https://auth.${SECRET_DOMAIN}/jwks.json
        claimToHeaders:
          - header: "x-user-id"
            claim: "sub"
          - header: "x-user-email"
            claim: "email"
          - header: "x-user-groups"
            claim: "groups"
  oidc:
    provider:
      issuer: https://auth.${SECRET_DOMAIN}
      authorizationEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
      tokenEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/token
    clientIDRef:
      name: ${APP_SUBDOMAIN:-${APP}}-oidc
    clientSecret:
      name: ${APP_SUBDOMAIN:-${APP}}-oidc
    redirectURL: https://${APP_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}/oauth2/callback
