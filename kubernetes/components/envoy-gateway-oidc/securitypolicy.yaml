---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: ${APP}-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ${ROUTE_NAME:-${APP}}
  oidc:
    provider:
      issuer: https://auth.${SECRET_DOMAIN}
      authorizationEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/authorization
      tokenEndpoint: https://auth.${SECRET_DOMAIN}/api/oidc/token
    clientIDRef:
      name: ${APP}-oidc
    clientSecret:
      name: ${APP}-oidc
    redirectURL: https://${APP_SUBDOMAIN:-${APP}}.${SECRET_DOMAIN}/oauth2/callback
