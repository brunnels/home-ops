---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}-backup
spec:
  compression:
    compressor: zstd
    neverCompress: [ "*.zip", "*.gz", "*.jpeg", "*.webp", "*.mp4" ]
  copyMethod: Snapshot
  files:
    ignoreRules: ${IGNORE_RULES:-["lost+found", "*/lost+found"]}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepLatest: 3
    keepHourly: 24
    keepDaily: 7
    keepWeekly: 4
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:=${APP}}
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ${LOCAL_STORAGECLASS:=openebs-hostpath}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=100}
      runAsNonRoot: ${KOPIUR_RUNASNONROOT:=true}
    privilegedMode: true
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
        timezone: ${TIMEZONE}
    quick:
      schedule:
        cron: H 3 * * *
        timezone: ${TIMEZONE}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=csi-ceph-blockpool}
