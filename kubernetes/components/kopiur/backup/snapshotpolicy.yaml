---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: ${APP}-backup
spec:
  compression:
    compressor: zstd
    neverCompress:
      - "*.zip"
      - "*.gz"
      - "*.jpeg"
      - "*.webp"
      - "*.mp4"
  copyMethod: Snapshot
  files:
    ignoreRules: ${IGNORE_RULES:-["lost+found", "*/lost+found"]}
  mover:
    cache:
      capacity: ${KOPIUR_CAPACITY:=5Gi}
      mode: Persistent
      storageClassName: ${LOCAL_STORAGECLASS:=miroir-local}
    podSecurityContext:
      fsGroup: ${KOPIUR_PGID:=1000}
    privilegedMode: true
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=100}
      runAsNonRoot: ${KOPIUR_RUNASNONROOT:=true}
  repository:
    kind: ClusterRepository
    name: nas
  retention:
    keepDaily: 7
    keepHourly: 24
    keepLatest: 3
    keepWeekly: 4
  sources:
    - pvc:
        name: ${KOPIUR_CLAIM:=${APP}}
  verification:
    deep:
      schedule:
        cron: H 5 1 * *
        timezone: ${TIMEZONE}
    quick:
      schedule:
        cron: H 3 * * *
        timezone: ${TIMEZONE}
  volumeSnapshotClassName: ${KOPIUR_SNAPSHOTCLASS:=miroir-snap}
