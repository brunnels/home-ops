---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.1/job-batch-v1.json
apiVersion: batch/v1
kind: Job
metadata:
  name: &name "${APP}-db-init"
  #annotations:
  #  kustomize.toolkit.fluxcd.io/reconcile: disabled
  labels:
    app.kubernetes.io/instance: *name
    app.kubernetes.io/name: *name
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: *name
        app.kubernetes.io/name: *name
    spec:
      restartPolicy: Never
      containers:
        - name: add-public-schema-grants
          image: ghcr.io/home-operations/postgres-init:18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
          env:
            - name: DB_NAMES
              value: "${DB_NAMES:-${APP}}"
            - name: DB_URI
              valueFrom:
                secretKeyRef:
                  key: uri
                  name: "${NAMESPACE}-pguser-postgres"
            - name: DB_USER
              value: "${DB_USER:-${APP}}"
            - name: EXTRA_DB_INIT_SQL
              value: "${EXTRA_DB_INIT_SQL:-''}"
          command:
            - /bin/bash
            - -c
          args:
            - |
              for DB in $DB_NAMES; do
                [ -n "$EXTRA_DB_INIT_SQL" ] && psql "$${DB_URI%/postgres}/$DB" -c "$EXTRA_DB_INIT_SQL"
                psql "$${DB_URI%/postgres}/$DB" -c "GRANT ALL ON SCHEMA public TO \"$DB_USER\";"
                psql "$${DB_URI%/postgres}/$DB" -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO \"$DB_USER\";"
              done
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 52Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
