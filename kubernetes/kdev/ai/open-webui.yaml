---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app open-webui
  annotations:
    fluxcd.io/helm-release-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/dragonfly-cluster
    - ../../../components/kopiur/backup
    - ../../../components/pgo-db-init
  dependsOn:
    - name: authelia-oidc-operator
      namespace: security
    - name: ai-pgo-cluster
    - name: dragonfly-operator
      namespace: database
    - name: kopiur-repository
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/ai/open-webui
  postBuild:
    substitute:
      APP: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
