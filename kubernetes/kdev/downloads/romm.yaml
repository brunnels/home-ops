---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app romm
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/dragonfly-cluster
    - ../../../components/pgo-db-init
    - ../../../components/volsync
  dependsOn:
    - name: external-secrets-stores
      namespace: external-secrets
#    - name: dragonfly-operator
#      namespace: database
    - name: downloads-pgo-cluster
    - name: volsync
      namespace: storage
  healthCheckExprs:
#    - apiVersion: dragonflydb.io/v1alpha1
#      kind: Dragonfly
#      inProgress: status.containerStatuses.all(e, e.ready != 'true')
#      current: status.containerStatuses.all(e, e.ready == 'true')
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/base/downloads/romm
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 8Gi
      VOLSYNC_CACHE_CAPACITY: 4Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
