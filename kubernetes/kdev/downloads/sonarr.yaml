---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sonarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/pgo-db-init
    - ../../../components/theme-park
    - ../../../components/volsync
  dependsOn:
    - name: downloads-pgo-cluster
    - name: volsync
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/downloads/sonarr
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 8Gi
      VOLSYNC_CACHE_CAPACITY: 4Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
