---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.32.1/storageclass.json
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-${NAMESPACE}-pgbackrest
provisioner: nfs.csi.k8s.io
parameters:
  server: ${QNAP_HOSTNAME}
  share: /appdata
  subDir: /${VAULT_PREFIX}/${NAMESPACE}-pgbackrest
reclaimPolicy: Delete
volumeBindingMode: Immediate
mountOptions:
  - nfsvers=4.1
  - hard
  - noatime
  - nodiratime
  - rsize=131072
  - wsize=131072
  - nconnect=8
allowVolumeExpansion: true
