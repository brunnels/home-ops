---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app home-assistant
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/envoy-gateway-oidc
    - ../../../components/kopiur/backup
  dependsOn:
    - name: kopiur-repository
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/automation/home-assistant
  postBuild:
    substitute:
      APP: *app
      APP_SUBDOMAIN: hass-code
      OIDC_DESCRIPTION: Home Assistant CodeServer
      OIDC_ROUTE_NAME: home-assistant-code-server
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
