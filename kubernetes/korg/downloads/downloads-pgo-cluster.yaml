---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app downloads-pgo-cluster
  annotations:
    fluxcd.io/helm-release-defaults: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: garage
      namespace: storage
    - name: crunchy-postgres-operator
      namespace: database
    - name: openebs-hostpath
      namespace: storage
  healthCheckExprs:
    - apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      failed: status.conditions.filter(e, e.type == "Ready").all(e, e.status == "False")
      current: status.conditions.filter(e, e.type == "Ready").all(e, e.status == "True")
    - apiVersion: postgres-operator.crunchydata.com/v1
      kind: PostgresCluster
      inProgress: status.conditions.filter(e, e.type == "ProxyAvailable").all(e, e.status != "True")
      current: status.conditions.filter(e, e.type == "ProxyAvailable").all(e, e.status == "True")
  interval: 1h
  path: ./kubernetes/base/database/pgo-cluster
  #
  # If you are adding a new cluster to a namespace make sure to update authelia configuration
  # identity_providers.oidc.clients pgAdmin client redirect_uris to include the new authorize endpoint
  # e.g. "https://<NAMESPACE>-pgadmin.${SECRET_DOMAIN}/oauth2/authorize"
  #
  # You may occasionally have one replica that refuses to start if you're modifying the cluster or testing
  # If this happens, delete the pvc and then the statefulset associated with stuck replica pod
  # The replica statefulset and pvc will be recreated automatically
  #
  # Remove this patch after the cluster has been created successfully.
  #patches:
  #  - patch: |-
  #      - op: remove
  #        path: /spec/dataSource
  #    target:
  #      group: postgres-operator.crunchydata.com
  #      kind: PostgresCluster
  postBuild:
    substitute:
      APP: *app
      # USERS should be a valid JSON array representing PostgresCluster spec.users
      USERS: |
        [
          {"name": "postgres", "databases": ["postgres"], "password": {"type": "AlphaNumeric"}, "options": "SUPERUSER"},
          {"name": "readarr", "databases": ["readarr", "readarr-cache", "readarr-log"], "password": {"type": "AlphaNumeric"}},
          {"name": "lidarr", "databases": ["prowlarr"], "password": {"type": "AlphaNumeric"}},
          {"name": "prowlarr", "databases": ["lidarr"], "password": {"type": "AlphaNumeric"}},
          {"name": "radarr", "databases": ["radarr"], "password": {"type": "AlphaNumeric"}},
          {"name": "romm", "databases": ["romm"], "password": {"type": "AlphaNumeric"}},
          {"name": "sonarr", "databases": ["sonarr"], "password": {"type": "AlphaNumeric"}}
        ]
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
