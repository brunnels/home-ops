---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app flood
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/envoy-gateway-oidc
    - ../../../components/kopiur/backup
    - ../../../components/theme-park
  dependsOn:
    - name: authelia-oidc-operator
      namespace: security
    - name: external-secrets-stores
      namespace: external-secrets
    - name: kopiur-repository
      namespace: storage
    - name: vpn-gateway
      namespace: network
  #healthChecks:
  #  - kind: HelmRelease
  #    name: vpn-gateway
  #    namespace: network
  interval: 1h
  path: ./kubernetes/base/downloads/flood
  postBuild:
    substitute:
      APP: *app
      IGNORE_RULES: |
        [
          "lost+found",
          "*/lost+found",
          "*/flood.secret"
        ]

  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
