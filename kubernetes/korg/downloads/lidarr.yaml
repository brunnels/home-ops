---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lidarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/envoy-gateway-oidc
    - ../../../components/kopiur/backup
    - ../../../components/pgo-db-init
    - ../../../components/theme-park
  dependsOn:
    - name: downloads-pgo-cluster
    - name: kopiur-repository
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/downloads/lidarr
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 8Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
