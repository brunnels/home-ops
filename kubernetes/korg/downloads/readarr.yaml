---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app readarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/envoy-gateway-oidc
    - ../../../components/kopiur
    - ../../../components/pgo-db-init
    - ../../../components/theme-park
    - ../../../components/volsync
  dependsOn:
    - name: downloads-pgo-cluster
    - name: kopiur-repository
      namespace: storage
    - name: volsync
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/downloads/readarr
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 8Gi
      DB_NAMES: "readarr readarr-cache readarr-log"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
