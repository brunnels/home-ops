---
# yaml-language-server: $schema=https://k8s-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../components/envoy-gateway-oidc
    - ../../../components/kopiur
    - ../../../components/theme-park
  dependsOn:
    - name: kopiur-repository
      namespace: storage
  interval: 1h
  path: ./kubernetes/base/downloads/sabnzbd
  postBuild:
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
