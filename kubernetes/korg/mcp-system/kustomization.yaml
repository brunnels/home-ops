---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp-system
components:
  - ../../clusters/korg
  - ../../components/common
replacements:
  - path: ../../components/replacements/ks.yaml
resources:
  - ./namespace.yaml
  # namespace first
  - ../../common/mcp-system/toolhive.yaml
  - ../../common/mcp-system/toolhive-config.yaml
  - ../../common/mcp-system/toolhive-crds.yaml
  - ./toolhive-mcp-servers.yaml
