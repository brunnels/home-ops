---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authelia
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_USER: "{{ .LDAP_SEARCH_BIND_DN }}"
        AUTHELIA_DUO_API_HOSTNAME: "{{ .DUO_API_HOSTNAME }}"
        AUTHELIA_NOTIFIER_SMTP_ADDRESS: "smtp://{{ .SMTP_HOST }}:{{ .SMTP_PORT }}"
        AUTHELIA_NOTIFIER_SMTP_USERNAME: "{{ .SMTP_USER }}"
        AUTHELIA_STORAGE_POSTGRES_ADDRESS: '{{ index . "host" }}'
        AUTHELIA_STORAGE_POSTGRES_DATABASE: '{{ index . "dbname" }}'
        AUTHELIA_STORAGE_POSTGRES_USERNAME: '{{ index . "user" }}'

        ESPHOME_OIDC_CLIENT_ID: "{{ .ESPHOME_OIDC_CLIENT_ID }}"
        FLOOD_OIDC_CLIENT_ID: "{{ .FLOOD_OIDC_CLIENT_ID }}"
        GRAFANA_OIDC_CLIENT_ID: "{{ .GRAFANA_OIDC_CLIENT_ID }}"
        PGADMIN_OIDC_CLIENT_ID: "{{ .PGADMIN_OIDC_CLIENT_ID }}"
        PROWLARR_OIDC_CLIENT_ID: "{{ .PROWLARR_OIDC_CLIENT_ID }}"
        RADARR_OIDC_CLIENT_ID: "{{ .RADARR_OIDC_CLIENT_ID }}"
        READARR_OIDC_CLIENT_ID: "{{ .READARR_OIDC_CLIENT_ID }}"
        ROMM_OIDC_CLIENT_ID: "{{ .ROMM_OIDC_CLIENT_ID }}"
        SABNZBD_OIDC_CLIENT_ID: "{{ .SABNZBD_OIDC_CLIENT_ID }}"
        SONARR_OIDC_CLIENT_ID: "{{ .SONARR_OIDC_CLIENT_ID }}"
        WEAVE_OIDC_CLIENT_ID: "{{ .WEAVE_OIDC_CLIENT_ID }}"
  data:
    - secretKey: ESPHOME_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/esphome"
        property: client-id
    - secretKey: FLOOD_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/flood"
        property: client-id
    - secretKey: PROWLARR_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/prowlarr"
        property: client-id
    - secretKey: READARR_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/readarr"
        property: client-id
    - secretKey: RADARR_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/radarr"
        property: client-id
    - secretKey: SABNZBD_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/sabnzbd"
        property: client-id
    - secretKey: SONARR_OIDC_CLIENT_ID
      remoteRef:
        key: "${VAULT_PREFIX}/sonarr"
        property: client-id
  dataFrom:
    - extract:
        key: "${VAULT_PREFIX}/authelia"
    - extract:
        key: duo
    - extract:
        key: "${VAULT_PREFIX}/grafana"
    - extract:
        key: "${VAULT_PREFIX}/pgadmin"
    - extract:
        key: qnap
    - extract:
        key: "${VAULT_PREFIX}/romm"
    - extract:
        key: smtp2go
    - extract:
        key: "${VAULT_PREFIX}/weave-gitops"
    - extract:
        key: "${NAMESPACE}-pguser-authelia"
      sourceRef:
        storeRef:
          kind: SecretStore
          name: "${NAMESPACE}-secrets"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authelia-files
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: akeyless-secret-store
  target:
    name: *name
    template:
      data:
        AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: "{{ .LDAP_SEARCH_PASSWORD }}"
        AUTHELIA_DUO_API_INTEGRATION_KEY: "{{ .DUO_INTEGRATION_KEY }}"
        AUTHELIA_DUO_API_SECRET_KEY: "{{ .DUO_SECRET_KEY }}"
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: "{{ .OIDC_HMAC_SECRET }}"
        AUTHELIA_NOTIFIER_SMTP_PASSWORD: "{{ .SMTP_PASS }}"
        AUTHELIA_SESSION_SECRET: "{{ .SESSION_SECRET }}"
        AUTHELIA_STORAGE_ENCRYPTION_KEY: "{{ .STORAGE_ENCRYPTION_KEY }}"
        AUTHELIA_STORAGE_POSTGRES_PASSWORD: '{{ index . "password" }}'

        OIDC_JWKS_KEY_PEM: "{{ .OIDC_JWKS_KEY_PEM }}"
        ESPHOME_OIDC_CLIENT_SECRET: "{{ .ESPHOME_OIDC_CLIENT_SECRET | bcrypt }}"
        FLOOD_OIDC_CLIENT_SECRET: "{{ .FLOOD_OIDC_CLIENT_SECRET | bcrypt }}"
        GRAFANA_OIDC_CLIENT_SECRET: "{{ .GRAFANA_OIDC_CLIENT_SECRET | bcrypt }}"
        PGADMIN_OIDC_CLIENT_SECRET: "{{ .PGADMIN_OIDC_CLIENT_SECRET | bcrypt }}"
        PROWLARR_OIDC_CLIENT_SECRET: "{{ .PROWLARR_OIDC_CLIENT_SECRET | bcrypt }}"
        RADARR_OIDC_CLIENT_SECRET: "{{ .RADARR_OIDC_CLIENT_SECRET | bcrypt }}"
        READARR_OIDC_CLIENT_SECRET: "{{ .READARR_OIDC_CLIENT_SECRET | bcrypt }}"
        ROMM_OIDC_CLIENT_SECRET: "{{ .ROMM_OIDC_CLIENT_SECRET | bcrypt }}"
        SONARR_OIDC_CLIENT_SECRET: "{{ .SONARR_OIDC_CLIENT_SECRET | bcrypt }}"
        SABNZBD_OIDC_CLIENT_SECRET: "{{ .SABNZBD_OIDC_CLIENT_SECRET | bcrypt }}"
        WEAVE_OIDC_CLIENT_SECRET: "{{ .WEAVE_OIDC_CLIENT_SECRET | bcrypt }}"
  data:
    - secretKey: ESPHOME_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/esphome"
        property: client-secret
    - secretKey: FLOOD_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/flood"
        property: client-secret
    - secretKey: PROWLARR_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/prowlarr"
        property: client-secret
    - secretKey: RADARR_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/radarr"
        property: client-secret
    - secretKey: READARR_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/readarr"
        property: client-secret
    - secretKey: SONARR_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/sonarr"
        property: client-secret
    - secretKey: SABNZBD_OIDC_CLIENT_SECRET
      remoteRef:
        key: "${VAULT_PREFIX}/sabnzbd"
        property: client-secret
  dataFrom:
    - extract:
        key: "${VAULT_PREFIX}/authelia"
    - extract:
        key: duo
    - extract:
        key: "${VAULT_PREFIX}/grafana"
    - extract:
        key: "${VAULT_PREFIX}/pgadmin"
    - extract:
        key: qnap
    - extract:
        key: "${VAULT_PREFIX}/romm"
    - extract:
        key: smtp2go
    - extract:
        key: "${VAULT_PREFIX}/weave-gitops"
    - extract:
        key: "${NAMESPACE}-pguser-authelia"
      sourceRef:
        storeRef:
          kind: SecretStore
          name: "${NAMESPACE}-secrets"
