# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
clusterName: kdev

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://10.0.150.200:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "10.0.150.200"
  - "kdev.lan.kraven.org"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: kdev-n1
    ipAddress: 10.0.150.254
    nameservers:
      - 10.0.200.1
    disableSearchDomain: true
    installDisk: /dev/disk/by-id/nvme-SK_hynix_BC511_HFM256GDJTNI-82A0A_NJ02N76261100320B
    controlPlane: true
    nodeLabels: &nodeLabels
      intel.feature.node.kubernetes.io/gpu: "true"
      topology.kubernetes.io/region: main
      nvidia.com/gpu.present: "true"
      node.kubernetes.io/gpu: "true"
    userVolumes: &userVolumes # non-ceph
      - name: lpp-0
        provisioning:
          diskSelector:
            match: disk.model != "FIKWOT FX991 1TB"
          minSize: 900GiB
    schematic: &schematic
      customization:
        extraKernelArgs:
          - -init_on_alloc # Less security, faster puter
          - -init_on_free # Less security, faster puter
          - -selinux # Less security, faster puter
          - -lockdown # Cilium BPF
          - apparmor=0 # Less security, faster puter
          - init_on_alloc=0 # Less security, faster puter
          - init_on_free=0 # Less security, faster puter
          - lockdown=integrity # Cilium BPF
          - mitigations=off # Less security, faster puter
          - security=none # Less security, faster puter
          - talos.auditd.disabled=1 # Less security, faster puter
          - i915.modeset=1 # Meteor Lake CPU / iGPU
          - i915.enable_guc=3 # Meteor Lake CPU / iGPU
          - sysctl.kernel.kexec_load_disabled=1 # Meteor Lake CPU / iGPU
          - intel_iommu=on # PCI Passthrough
          - iommu=pt # PCI Passthrough
          - pci=realloc # PCI Passthrough
          - net.ifnames=0 # Normalize interface names
          - nouveau.modeset=0
          - nvidia-drm.modeset=1
        systemExtensions:
          officialExtensions:
            - siderolabs/binfmt-misc
            - siderolabs/fuse3
            - siderolabs/i915
            - siderolabs/intel-ice-firmware
            - siderolabs/intel-ucode
            - siderolabs/iscsi-tools
            - siderolabs/joydev
            - siderolabs/mei
            - siderolabs/nfs-utils
            - siderolabs/nfsrahead
            - siderolabs/nonfree-kmod-nvidia-production
            - siderolabs/nvidia-container-toolkit-production
            - siderolabs/nvme-cli
            - siderolabs/thunderbolt
            - siderolabs/uhid
            - siderolabs/uinput
    networkInterfaces: &networkInterfaces
      - interface: bond0
        mtu: 9000
        bond:
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: layer3+4
          miimon: 100
          updelay: 200
          downdelay: 200
          interfaces:
            - eth2
            - eth3
        vlans:
          - vlanId: 150
            dhcp: false
            routes:
              - network: 0.0.0.0/0
                gateway: 10.0.150.1
            mtu: 9000
            vip:
              ip: 10.0.150.200
      - deviceSelector:
          busPath: 1-1.0
        dhcp: false
        mtu: 65520
      - deviceSelector:
          busPath: 0-1.0
        dhcp: false
        mtu: 65520
      - interface: eth0
        dhcp: false
      - interface: eth1
        dhcp: false
    #    extensionServices: &extensionServices
    #      - name: nut-client
    #        configFiles:
    #          - content: MONITOR ${upsmonHost} 1 monuser secret slave
    #            mountPath: /usr/local/etc/nut/upsmon.conf
    #          - content: MODE=netclient
    #            mountPath: /usr/local/etc/nut/nut.conf
    #      - name: lldpd
    #        configFiles:
    #          - mountPath: /usr/local/etc/lldpd/lldpd.conf
    #            content: |
    #              configure lldpd portidsubtype ifname
    #              configure system description "Talos Node"
    patches:
      - "@./manifests/ethernetconfig.yaml"
      - "@./manifests/oomconfig.yaml"
      - "@./manifests/timesyncconfig.yaml"
      - "@./manifests/watchdogtimerconfig.yaml"
      - |
        machine:
          network:
            interfaces:
              - interface: bond0
                vlans:
                  - vlanId: 150
                    addresses: [10.0.150.254/24]
              - deviceSelector:
                  busPath: 1-1.0
                addresses: [169.254.255.101/32]
                routes:
                  - network: 169.254.255.103/32
                    metric: 2048
              - deviceSelector:
                  busPath: 0-1.0
                addresses: [169.254.255.101/32]
                routes:
                  - network: 169.254.255.102/32
                    metric: 2048

  - hostname: kdev-n2
    ipAddress: 10.0.150.253
    nameservers:
      - 10.0.200.1
    disableSearchDomain: true
    installDisk: /dev/disk/by-id/nvme-BPX_8B71077C060891075911
    controlPlane: true
    nodeLabels: *nodeLabels
    schematic: *schematic
    #extensionServices: *extensionServices
    networkInterfaces: *networkInterfaces
    userVolumes: *userVolumes
    patches:
      - "@./manifests/ethernetconfig.yaml"
      - "@./manifests/oomconfig.yaml"
      - "@./manifests/timesyncconfig.yaml"
      - "@./manifests/watchdogtimerconfig.yaml"
      - |
        machine:
          network:
            interfaces:
              - interface: bond0
                vlans:
                  - vlanId: 150
                    addresses: [10.0.150.253/24]
              - deviceSelector:
                  busPath: 1-1.0
                addresses: [169.254.255.102/32]
                routes:
                  - network: 169.254.255.101/32
                    metric: 2048
              - deviceSelector:
                  busPath: 0-1.0
                addresses: [169.254.255.102/32]
                routes:
                  - network: 169.254.255.103/32
                    metric: 2048

  - hostname: kdev-n3
    ipAddress: 10.0.150.252
    nameservers:
      - 10.0.200.1
    disableSearchDomain: true
    installDisk: /dev/disk/by-id/nvme-Samsung_SSD_950_PRO_256GB_S2GLNCAGB26901M
    controlPlane: true
    nodeLabels: *nodeLabels
    schematic: *schematic
    #extensionServices: *extensionServices
    networkInterfaces: *networkInterfaces
    userVolumes: *userVolumes
    patches:
      - "@./manifests/ethernetconfig.yaml"
      - "@./manifests/oomconfig.yaml"
      - "@./manifests/timesyncconfig.yaml"
      - "@./manifests/watchdogtimerconfig.yaml"
      - |
        machine:
          network:
            interfaces:
              - interface: bond0
                vlans:
                  - vlanId: 150
                    addresses: [10.0.150.252/24]
              - deviceSelector:
                  busPath: 1-1.0
                addresses: [169.254.255.103/32]
                routes:
                  - network: 169.254.255.101/32
                    metric: 2048
              - deviceSelector:
                  busPath: 0-1.0
                addresses: [169.254.255.103/32]
                routes:
                  - network: 169.254.255.102/32
                    metric: 2048
# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-modules.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-sysfs.yaml"
  - "@./patches/global/machine-udev.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
    - "@./patches/controller/machine-features.yaml"
