apiVersion: v1alpha1
kind: CRICustomizationConfig
name: containerd
content: |
  [plugins."io.containerd.cri.v1.images"]
    discard_unpacked_layers = false
---
# NFS mount global options
machine:
  files:
    - op: overwrite
      path: /etc/nfsmount.conf
      permissions: 0o644
      content: |
        [ NFSMount_Global_Options ]
        nfsvers = 4.1
        hard = True
        noatime = True
        nodiratime = True
        rsize=1048576
        wsize=1048576
